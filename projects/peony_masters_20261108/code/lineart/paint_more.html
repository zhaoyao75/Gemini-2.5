<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script src="meta.js"></script>
<script>
// ?style=cezanne | munch | kandinsky | dali | pollock — same line art
const meta = window.META;
const STYLE = new URLSearchParams(location.search).get('style') || 'cezanne';
const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
const px = im => { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); return x.getImageData(0, 0, im.width, im.height).data; };
let seed = 9001; const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rand(), clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), shade = (c, f) => c.map(v => clamp(v * f, 0, 255));
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hash = (a, b, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
const pick = a => hex(a[(rand() * a.length) | 0]);
const WALL = 0, TABLE = 1, VASE_W = 2, VASE_B = 3, STEM = 4, LEAF = 5, PETAL = 6, STAMEN = 7, BUD = 8, SEPAL = 9;
const noise = (x, y) => Math.sin(x * 0.011 + Math.sin(y * 0.007) * 3) * Math.cos(y * 0.013 + Math.sin(x * 0.005) * 2);

(async () => {
  const [imC, imL] = await Promise.all(['cls.png', 'line.png'].map(load));
  const C = px(imC), Ln = px(imL), W = meta.W, H = meta.H, TY = meta.table_y;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const info = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const o = (y * W + x) * 4; return { k: C[o], bl: C[o + 1], puff: C[o + 2] / 255, role: (meta.blooms[C[o + 1] - 1] || [0, 0, 0, 0, 'a'])[4] }; };
  const inkAt = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const o = (y * W + x) * 4; return Ln[o] === 255 ? 0 : 1 - Ln[o + 1] / 255; };
  const grad = (x, y) => { const a = info(x + 3, y).puff - info(x - 3, y).puff, b = info(x, y + 3).puff - info(x, y - 3).puff; return [a, b]; };
  const isObj = k => k >= VASE_W;
  function fillPixels(fn) { const img = ctx.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const c = fn(x, y), o = (y * W + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255; }
    ctx.putImageData(img, 0, 0); }
  function inkOver(colFn, gain = 1.2, thick = 0) {
    const img = ctx.getImageData(0, 0, W, H), d = img.data;
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
      let v = inkAt(x, y); if (thick) v = Math.max(v, 0.8 * Math.max(inkAt(x - 1, y), inkAt(x + 1, y), inkAt(x, y - 1), inkAt(x, y + 1)));
      if (v < 0.1) continue; const o = (y * W + x) * 4, lc = colFn(info(x, y), x, y); if (!lc) continue; const a = clamp(v * gain);
      d[o] = d[o] * (1 - a) + lc[0] * a; d[o + 1] = d[o + 1] * (1 - a) + lc[1] * a; d[o + 2] = d[o + 2] * (1 - a) + lc[2] * a; }
    ctx.putImageData(img, 0, 0); }
  const grain = (a = 0.035) => { ctx.globalAlpha = a; for (let y = 0; y < H; y += 3) { ctx.fillStyle = rand() < 0.5 ? '#000' : '#fff'; ctx.fillRect(0, y, W, 1); } ctx.globalAlpha = 1; };
  function strokes(sp, len, wid, colFn, angFn, only = null, keep = 1) {
    const list = [];
    for (let y = 0; y < H; y += sp) for (let x = 0; x < W; x += sp) if (rand() < keep) { const xx = x + R(-sp, sp) * 0.6, yy = y + R(-sp, sp) * 0.6, p = info(xx, yy); if (!only || only.includes(p.k)) list.push([xx, yy, p]); }
    for (let i = list.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
    ctx.lineCap = 'round';
    for (const [x, y, p] of list) { const a = angFn(p, x, y), c = colFn(p, x, y), l = len * R(0.7, 1.3);
      ctx.strokeStyle = css(c, R(0.8, 0.95)); ctx.lineWidth = wid * R(0.8, 1.2);
      ctx.beginPath(); ctx.moveTo(x - Math.cos(a) * l / 2, y - Math.sin(a) * l / 2); ctx.lineTo(x + Math.cos(a) * l / 2, y + Math.sin(a) * l / 2); ctx.stroke(); }
  }

  // ================= CÉZANNE: constructive parallel strokes, warm/cool modulation =================
  if (STYLE === 'cezanne') {
    const P = { wall: ['#7a8aa0', '#8a98a8', '#6a7a92', '#9aa0a0', '#a89a7a'], table: ['#8a5a32', '#a06a3a', '#6e4428', '#b07a48'],
      cloth: ['#e8e6e0', '#d0d8e4', '#c4cce0', '#f2ece0'],
      bloom: { a: ['#a8406a', '#d8708a', '#f0a8a8'], b: ['#8a2a2a', '#c04a32', '#e07a48'], c: ['#b8b8c8', '#e8e0d0', '#f8f2e8'] },
      leaf: ['#2e5a4a', '#4a7a44', '#6a8a3a', '#3a5a6a'], stem: ['#6a7a3a'], vaseW: ['#e8e4dc', '#c8d0dc', '#f4f0e6'], vaseB: ['#2a4a8a', '#3a5a9a'], stamen: ['#e0a830', '#c88a28'], bud: ['#a83a5a', '#d8607a'] };
    const col = (p, x, y) => {
      const t = p.puff;
      switch (p.k) {
        case WALL: return pick(P.wall);
        case TABLE: return (x > 120 && x < 980 && y > TY + 30) ? mix(pick(P.cloth), hex('#8a9ab8'), clamp(0.5 - noise(x, y)) * 0.4) : pick(P.table);
        case VASE_W: return pick(P.vaseW); case VASE_B: return pick(P.vaseB);
        case STEM: case SEPAL: return pick(P.stem);
        case LEAF: return hex(P.leaf[Math.min(3, (t * 3.2 + rand() * 0.8) | 0)]);
        case STAMEN: return pick(P.stamen); case BUD: return pick(P.bud);
        case PETAL: { const B = P.bloom[p.role]; let c = hex(B[Math.min(2, (t * 2.6 + rand() * 0.7) | 0)]);
          if (t < 0.3 && rand() < 0.4) c = mix(c, hex('#4a5a8a'), 0.4); return c; }   // cool blue in the shadows
      }
      return [0, 0, 0];
    };
    fillPixels((x, y) => shade(col(info(x, y), x, y), 0.92));
    // patches of parallel diagonal strokes (the "constructive stroke")
    const ang = (p, x, y) => { const h = hash(Math.floor(x / 34), Math.floor(y / 34)); return (h < 0.75 ? -1.0 : -0.55) + (h - 0.5) * 0.25; };
    strokes(9, 26, 9, col, ang); strokes(6, 18, 6, col, ang, [PETAL, LEAF, VASE_W, VASE_B, BUD, STAMEN]);
    // blue, repeated, broken contours
    inkOver((p) => hex(p.k === WALL ? '#2a3a6a' : '#1e2e5a'), 0.9, 1);
    grain(0.03);
  }

  // ================= MUNCH: undulating bands (The Scream) =================
  if (STYLE === 'munch') {
    const sky = ['#e8642a', '#f0a83a', '#d83a22', '#f6c84a', '#c8502a'], low = ['#2a3a7a', '#3a5aa0', '#5a6aa8', '#1e2a5a', '#4a7aa0'];
    const wave = (x, y) => y + 60 * Math.sin(x * 0.006 + y * 0.002) + 30 * Math.sin(x * 0.013 - y * 0.004);
    const bandCol = (x, y) => { const w = wave(x, y), b = Math.floor(w / 26), arr = w < 560 ? sky : low; return hex(arr[((b % arr.length) + arr.length) % arr.length]); };
    const P = { bloom: { a: ['#c83a6a', '#e86a8a', '#f4a0a0'], b: ['#8a1a2a', '#c83a2a', '#e86a3a'], c: ['#d8c8b0', '#f0e4d0', '#fff6e8'] },
      leaf: ['#1e4a3a', '#3a6a3a', '#5a8a4a'], vaseW: ['#e8e0d0', '#d0d0e0'], vaseB: ['#1e3a8a'], table: ['#6a3a2a', '#8a4a2a', '#4a2a2a'] };
    const col = (p, x, y) => {
      switch (p.k) {
        case WALL: return bandCol(x, y);
        case TABLE: { const b = Math.floor((y + 20 * Math.sin(x * 0.01)) / 18); return hex(P.table[((b % 3) + 3) % 3]); }
        case VASE_W: return hex(P.vaseW[Math.floor(p.puff * 4) % 2]); case VASE_B: return hex(P.vaseB[0]);
        case LEAF: case STEM: case SEPAL: return hex(P.leaf[Math.min(2, Math.floor(p.puff * 3))]);
        case STAMEN: return hex('#f0c030'); case BUD: return hex('#c83a5a');
        case PETAL: { const B = P.bloom[p.role]; return hex(B[Math.floor(p.puff * 5) % 3]); }   // concentric bands echo the petal outlines
      }
      return [0, 0, 0];
    };
    fillPixels((x, y) => col(info(x, y), x, y));
    const ang = (p, x, y) => {
      if (p.k === WALL || p.k === TABLE) { const e = 2, a = wave(x + e, y) - wave(x - e, y), b = wave(x, y + e) - wave(x, y - e); return Math.atan2(b, a) + Math.PI / 2; }
      const [gx, gy] = grad(x, y); return Math.atan2(gy, gx) + Math.PI / 2;
    };
    strokes(10, 46, 9, (p, x, y) => col(p, x, y).map(v => clamp(v + R(-18, 18), 0, 255)), ang);
    strokes(7, 30, 6, (p, x, y) => col(p, x, y).map(v => clamp(v + R(-18, 18), 0, 255)), ang, [PETAL, LEAF, VASE_W, BUD]);
    inkOver(() => hex('#1a1424'), 1.2, 1);
    grain(0.05);
  }

  // ================= KANDINSKY: geometric abstraction (Composition VIII) =================
  if (STYLE === 'kandinsky') {
    const bg = hex('#ece2c8');
    fillPixels((x, y) => { const v = 0.04 * noise(x * 0.5, y * 0.5); return shade(mix(bg, hex('#d8e0e0'), clamp(y / H)), 1 + v); });
    ctx.lineCap = 'round';
    // background geometry: arcs, lines, triangles, checkerboard, small circles
    const L = (x0, y0, x1, y1, w = 3, c = '#1a1a1a') => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke(); };
    for (let i = 0; i < 26; i++) L(R(0, W), R(0, H), R(0, W), R(0, H), R(1.5, 4));
    for (let i = 0; i < 10; i++) { ctx.strokeStyle = '#1a1a1a'; ctx.lineWidth = R(2, 4); ctx.beginPath(); ctx.arc(R(0, W), R(0, H), R(60, 260), R(0, 6), R(0, 6) + R(0.6, 2)); ctx.stroke(); }
    const tri = (x, y, s, c) => { ctx.fillStyle = c; ctx.beginPath(); const a = R(0, 6); for (let k = 0; k < 3; k++) ctx.lineTo(x + Math.cos(a + k * 2.1 + R(-0.3, 0.3)) * s, y + Math.sin(a + k * 2.1 + R(-0.3, 0.3)) * s); ctx.fill(); };
    ['#f2c23a', '#d8402a', '#2a4a9a', '#1a1a1a', '#6aa04a', '#e88a2a'].forEach((c, i) => { tri(R(40, W - 40), R(40, H - 40), R(25, 70), c); tri(R(40, W - 40), R(40, H - 40), R(20, 50), c); });
    for (let i = 0; i < 14; i++) { ctx.fillStyle = ['#1a1a1a', '#d8402a', '#2a4a9a', '#f2c23a'][i % 4]; ctx.beginPath(); ctx.arc(R(0, W), R(0, H), R(5, 16), 0, 7); ctx.fill(); }
    // the objects, transformed: leaves -> flat facets, stems -> black lines, vase -> checkerboard
    const img = ctx.getImageData(0, 0, W, H), d = img.data;
    const leafCols = [hex('#3a8a4a'), hex('#6ab04a'), hex('#1e5a5a'), hex('#a8c83a')];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const p = info(x, y), o = (y * W + x) * 4; let c = null;
      if (p.k === LEAF || p.k === SEPAL) c = leafCols[(Math.floor((x * 0.7 + y) / 38) + Math.floor((x - y * 0.5) / 46)) & 3];
      else if (p.k === STEM) c = hex('#1a1a1a');
      else if (p.k === VASE_W || p.k === VASE_B) { const ch = (Math.floor(x / 26) + Math.floor(y / 26)) & 1; c = p.k === VASE_B ? hex('#2a4a9a') : ch ? hex('#f6f2e8') : hex('#1a1a1a');
        if (p.k === VASE_W && (y - meta.vase.y0) % 120 < 60 && ch) c = hex('#f2c23a'); }
      if (c) { d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; }
    }
    ctx.putImageData(img, 0, 0);
    // blooms -> concentric circles (Kandinsky's colour-study circles), buds -> small circle pairs
    const ring = { a: ['#d8402a', '#f2c23a', '#2a4a9a', '#e88aa8', '#1a1a1a', '#f6f2e8'], b: ['#1a1a1a', '#d8402a', '#e88a2a', '#7a2a8a', '#f2c23a', '#d8402a'], c: ['#2a4a9a', '#f6f2e8', '#e88aa8', '#f2c23a', '#6aa04a', '#f6f2e8'] };
    meta.blooms.forEach(([cx, cy, rx, ry, role]) => {
      const Rr = Math.min(rx, ry) * 0.95, rs = ring[role];
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.arc(cx + 10, cy + 12, Rr * 1.08, 0, 7); ctx.fill();   // halo
      rs.forEach((c, k) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx + (k % 2 ? 4 : -4), cy + (k % 3 - 1) * 4, Rr * (1 - k / rs.length), 0, 7); ctx.fill(); });
      ctx.fillStyle = '#f2c23a'; ctx.beginPath(); ctx.arc(cx, cy, Rr * 0.12, 0, 7); ctx.fill();
    });
    [[490, 200, 48], [885, 550, 42], [140, 830, 44]].forEach(([x, y, r], i) => { ctx.fillStyle = ['#d8402a', '#7a2a8a', '#e88a2a'][i]; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(x + r * 0.2, y - r * 0.2, r * 0.4, 0, 7); ctx.fill(); });
    L(0, TY, W, TY, 4); for (let i = 0; i < 6; i++) L(R(0, W), R(0, H), R(0, W), R(0, H), R(1, 2.5));
    grain(0.03);
  }

  // ================= DALÍ: melting bouquet in a desert dreamscape =================
  if (STYLE === 'dali') {
    // smooth academic rendering of the bouquet
    const P = { bloom: { a: ['#a8305a', '#e87a9a', '#fcd8e0'], b: ['#6a1020', '#c8303a', '#f48a7a'], c: ['#b8a8a0', '#f0e8e0', '#ffffff'] },
      leaf: ['#1e3a22', '#4a7a3a', '#8ab060'], vaseW: ['#c8c4c0', '#f4f2ee'], vaseB: '#2a4aa8' };
    const obj = (p, x, y) => { const t = p.puff;
      switch (p.k) {
        case PETAL: { const B = P.bloom[p.role]; return t < 0.5 ? mix(hex(B[0]), hex(B[1]), t * 2) : mix(hex(B[1]), hex(B[2]), (t - 0.5) * 2); }
        case LEAF: case SEPAL: return t < 0.5 ? mix(hex(P.leaf[0]), hex(P.leaf[1]), t * 2) : mix(hex(P.leaf[1]), hex(P.leaf[2]), (t - 0.5) * 2);
        case STEM: return hex('#5a7a3a'); case STAMEN: return mix(hex('#c88a18'), hex('#f8d850'), t); case BUD: return mix(hex('#7a1a3a'), hex('#e8708a'), t);
        case VASE_W: { const dx = (x - meta.vase.cx) / 190; return mix(hex(P.vaseW[1]), hex(P.vaseW[0]), clamp(Math.abs(dx + 0.3) * 1.2)); }
        case VASE_B: return hex(P.vaseB);
      }
      return null;
    };
    // melt: pixels below a sagging line are pulled downward in long drips
    const drip = (x, y) => {
      const start = 1040 + 40 * Math.sin(x * 0.02);
      if (y < start || x < meta.vase.x0 + 10 || x > meta.vase.x1 - 10) return 0;
      // a few long, narrow drips hanging from the sagging vase
      const tongue = Math.pow(Math.max(0, Math.sin(x * 0.045 + 1.3)), 8) * 2.2 + Math.pow(Math.max(0, Math.sin(x * 0.017 - 0.4)), 10) * 1.6;
      return (y - start) * (0.25 + tongue);
    };
    const horizon = 980;
    fillPixels((x, y) => {
      // desert dream landscape
      let c;
      if (y < horizon) { const t = y / horizon; c = mix(hex('#2a5aa8'), hex('#f2d8a8'), Math.pow(t, 1.6)); }
      else { const t = (y - horizon) / (H - horizon); c = mix(hex('#c89a5a'), hex('#8a5a32'), t); }
      // distant cliffs (Cap de Creus)
      const cliff = horizon - 70 - 60 * Math.max(0, Math.sin(x * 0.006 - 2.2)) * (x > 700 ? 1 : 0) - 30 * Math.sin(x * 0.02) * (x > 760 ? 1 : 0);
      if (y > cliff && y < horizon && x > 640) c = mix(hex('#c88a4a'), hex('#7a4a2a'), (y - cliff) / 120 * 0.8 + (x - 640) / 900 * 0.3);
      if (y > horizon - 8 && y < horizon && x < 640) c = hex('#e8c890');            // calm sea strip
      // bouquet (melted)
      const sy = y - drip(x, y), p = info(x, sy), o = isObj(p.k) ? obj(p, x, sy) : null;
      if (o) { const ink = inkAt(x, sy); c = ink > 0.3 ? mix(o, shade(o, 0.45), ink * 0.6) : o; }
      // long hard shadow cast to the right
      else if (y > horizon) { const q = info(x - (y - horizon) * 1.6 - 60, horizon - (y - horizon) * 2.2 + 140); if (isObj(q.k)) c = shade(c, 0.55); }
      return c;
    });
    // a stone block on the plain
    const bx0 = 760, bx1 = 1060, by0 = 1180, by1 = 1330;
    ctx.fillStyle = '#9a7a5a'; ctx.fillRect(bx0, by0, bx1 - bx0, by1 - by0);
    ctx.fillStyle = '#b89870'; ctx.beginPath(); ctx.moveTo(bx0, by0); ctx.lineTo(bx0 + 40, by0 - 30); ctx.lineTo(bx1 + 26, by0 - 30); ctx.lineTo(bx1, by0); ctx.fill();
    ctx.fillStyle = 'rgba(40,20,10,0.35)'; ctx.fillRect(bx1, by0 + 10, 26, by1 - by0);
    // a soft watch draped over the block's edge (The Persistence of Memory)
    const cx = 830, cy = by0 - 6;
    ctx.save(); ctx.translate(cx, cy);
    // the part hanging down the front face
    ctx.fillStyle = '#c8a850'; ctx.beginPath(); ctx.moveTo(-95, 0); ctx.bezierCurveTo(-100, 70, -60, 150, -20, 175); ctx.bezierCurveTo(10, 150, 40, 60, 70, 0); ctx.fill();
    ctx.fillStyle = '#efe4c8'; ctx.beginPath(); ctx.moveTo(-80, 0); ctx.bezierCurveTo(-82, 60, -50, 125, -20, 150); ctx.bezierCurveTo(5, 125, 30, 55, 55, 0); ctx.fill();
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4; [[-60, 40], [-40, 95], [-20, 135], [20, 60]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 4, y + 12); ctx.stroke(); });
    ctx.scale(1, 0.4);
    ctx.fillStyle = '#d8c070'; ctx.beginPath(); ctx.ellipse(-12, 0, 110, 90, 0, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = '#f4ecd8'; ctx.beginPath(); ctx.ellipse(-12, 0, 98, 78, 0, Math.PI, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4; for (let k = 6; k < 12; k++) { const a = k / 12 * 6.283; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 78, Math.sin(a) * 66); ctx.lineTo(Math.cos(a) * 92, Math.sin(a) * 78); ctx.stroke(); }
    ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(40, -50); ctx.moveTo(-12, 0); ctx.lineTo(-60, -30); ctx.stroke();
    ctx.restore();
    grain(0.02);
  }

  // ================= POLLOCK: drip painting, the bouquet emerging from the colours =================
  if (STYLE === 'pollock') {
    fillPixels((x, y) => shade(hex('#d8ccb0'), 1 + 0.05 * noise(x, y)));
    const regionCol = p => {
      switch (p.k) {
        case PETAL: return [hex('#d83a5a'), hex('#e8709a'), hex('#f4f0e8'), hex('#a8202a')][(rand() * 4) | 0];
        case LEAF: case STEM: case SEPAL: return [hex('#2a6a3a'), hex('#4a8a3a'), hex('#1a1a1a')][(rand() * 3) | 0];
        case VASE_W: case VASE_B: return [hex('#2a4aa8'), hex('#f4f0e8'), hex('#1a1a1a')][(rand() * 3) | 0];
        case STAMEN: return hex('#f2c23a'); case BUD: return hex('#c83a5a');
        default: return [hex('#1a1a1a'), hex('#f4f0e8'), hex('#8a8a8a'), hex('#c8a050'), hex('#1a1a1a')][(rand() * 5) | 0];
      }
    };
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const drips = (n, maxLen, wmin, wmax, objOnly) => {
      for (let i = 0; i < n; i++) {
        let x = R(0, W), y = R(0, H); const p = info(x, y);
        if (objOnly && !isObj(p.k)) continue;
        const c = regionCol(p); let a = R(0, 6.28), w = R(wmin, wmax);
        ctx.strokeStyle = css(c, R(0.75, 0.95)); ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x, y);
        const L = R(maxLen * 0.3, maxLen);
        for (let s = 0; s < L; s += 6) {
          a += R(-0.55, 0.55); x += Math.cos(a) * 6; y += Math.sin(a) * 6;
          if (objOnly && !isObj(info(x, y).k) && rand() < 0.3) a += Math.PI * 0.7;   // drips loop back inside the shape
          ctx.lineTo(x, y);
          if (rand() < 0.04) { ctx.stroke(); ctx.lineWidth = Math.max(0.6, w * R(0.3, 1.6)); ctx.beginPath(); ctx.moveTo(x, y); }
        }
        ctx.stroke();
        if (rand() < 0.35) for (let k = 0; k < 8; k++) { ctx.fillStyle = css(c, 0.9); ctx.beginPath(); ctx.arc(x + R(-30, 30), y + R(-30, 30), R(1, 5), 0, 7); ctx.fill(); }   // splatter
      }
    };
    drips(700, 900, 1, 4, false);          // layered skeins over the whole canvas
    drips(2600, 260, 1.5, 6, true);         // denser colour where the flowers, leaves and vase are
    drips(400, 600, 0.8, 2.5, false);       // final black and white webs on top
    grain(0.03);
  }
  window.DONE = true;
})();
