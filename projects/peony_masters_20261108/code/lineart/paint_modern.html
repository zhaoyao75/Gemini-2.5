<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script src="meta.js"></script>
<script>
// ?style=monet | mondrian | picasso  — same line art, three different painters
const meta = window.META;
const STYLE = new URLSearchParams(location.search).get('style') || 'monet';
const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
const px = im => { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); return x.getImageData(0, 0, im.width, im.height).data; };
let seed = 4242; const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rand(), clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), shade = (c, f) => c.map(v => clamp(v * f, 0, 255));
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hash = (a, b, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
const pick = a => hex(a[(rand() * a.length) | 0]);
const WALL = 0, TABLE = 1, VASE_W = 2, VASE_B = 3, STEM = 4, LEAF = 5, PETAL = 6, STAMEN = 7, BUD = 8, SEPAL = 9;
const noise = (x, y) => Math.sin(x * 0.011 + Math.sin(y * 0.007) * 3) * Math.cos(y * 0.013 + Math.sin(x * 0.005) * 2);

(async () => {
  const [imC, imL] = await Promise.all(['cls.png', 'line.png'].map(load));
  const C = px(imC), Ln = px(imL), W = meta.W, H = meta.H;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const info = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const o = (y * W + x) * 4; return { k: C[o], bl: C[o + 1], puff: C[o + 2] / 255, role: (meta.blooms[C[o + 1] - 1] || [0, 0, 0, 0, 'a'])[4] }; };
  const inkAt = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const o = (y * W + x) * 4; return Ln[o] === 255 ? 0 : 1 - Ln[o + 1] / 255; };

  // ======================= MONET =======================
  if (STYLE === 'monet') {
    const P = {
      wall: ['#b8c4e4', '#c8b8dc', '#a8c8c0', '#d8d0e8', '#9ab4d8', '#c4d8b8', '#e8d4dc'],   // Water-lilies haze
      table: ['#c8a8b8', '#b898b0', '#d8b8a8', '#a890b8', '#e0c4b0'],
      porcelain: ['#f4f2f4', '#e4e8f4', '#f8f0e8', '#dcdcf0'], cobalt: ['#4a62b8', '#5a78c8', '#6a6ab8', '#4a80c0'],
      leaf: ['#4a8a5a', '#6aa060', '#3a7a6a', '#8ab868', '#5a8aa0', '#a8c070'],
      stem: ['#6a9a58', '#8ab468', '#5a8a70'], stamen: ['#f8d848', '#f0b840', '#fff0a0'],
      bloom: { a: ['#e87aa0', '#f4a8c4', '#fcd4e0', '#c86aa8', '#ffe8f0'], b: ['#d83a5a', '#e86070', '#f49488', '#b8386a', '#ffc0a8'], c: ['#fcf4f0', '#f8e4ec', '#ffffff', '#e4d8f0', '#fff4e0'] },
      bud: ['#e05a88', '#f08aa8', '#c84a7a'],
    };
    function color(p, x, y) {
      const lit = clamp(0.5 - (x / W - 0.5) * 0.6 - (y / H - 0.5) * 0.6);       // sunlight from upper left
      switch (p.k) {
        case WALL: return mix(pick(P.wall), hex('#fff4d8'), lit * 0.25);
        case TABLE: return pick(P.table);
        case VASE_W: { const dx = (x - meta.vase.cx) / 190; return dx < -0.2 && rand() < 0.4 ? hex('#fffaf0') : dx > 0.3 && rand() < 0.5 ? hex('#c8c0e8') : pick(P.porcelain); }
        case VASE_B: return pick(P.cobalt);
        case STEM: case SEPAL: return pick(P.stem);
        case LEAF: return rand() < 0.12 ? hex('#4a6ab8') : mix(pick(P.leaf), hex('#e8f0a0'), lit * 0.3 * p.puff);
        case STAMEN: return pick(P.stamen);
        case BUD: return pick(P.bud);
        case PETAL: { const B = P.bloom[p.role];
          const r = rand();
          if (p.puff < 0.38 && r < 0.8) return mix(hex(B[3]), hex('#7a5aa8'), 0.25);                               // violet shadow in the folds
          if (p.puff > 0.65 && r < 0.5 + lit * 0.4) return hex(B[4]);                  // sunlit edges
          return mix(hex(B[(rand() * 3) | 0]), hex('#fff0e0'), lit * 0.2); }
      }
      return [0, 0, 0];
    }
    // light wash
    ctx.fillStyle = '#c8c8e0'; ctx.fillRect(0, 0, W, H);
    function pass(sp, sz, jit, keep = 1) {
      const list = [];
      for (let y = 0; y < H; y += sp) for (let x = 0; x < W; x += sp) if (rand() < keep) list.push([x + R(-sp, sp), y + R(-sp, sp)]);
      for (let i = list.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
      for (const [x, y] of list) {
        const p = info(x + R(-jit, jit), y + R(-jit, jit));                     // soft, lost edges
        const c = color(p, x, y).map(v => clamp(v + R(-12, 12), 0, 255));
        const puffAt = (xx, yy) => info(xx, yy).puff;
        let a;
        if (p.k <= TABLE) a = noise(x * 0.6, y * 0.6) * 0.8 + R(-0.4, 0.4);
        else { const gx = puffAt(x + 3, y) - puffAt(x - 3, y), gy = puffAt(x, y + 3) - puffAt(x, y - 3);
               a = Math.abs(gx) + Math.abs(gy) > 1e-3 ? Math.atan2(gy, gx) + Math.PI / 2 + R(-0.3, 0.3) : R(0, 6.28); }  // follow petal rims
        const s = sz * (p.k === PETAL || p.k === STAMEN ? 0.75 : p.k === VASE_B ? 0.55 : 1) * R(0.7, 1.3);
        ctx.fillStyle = css(c, R(0.75, 0.95));
        ctx.beginPath(); ctx.ellipse(x, y, s, s * R(0.28, 0.42), a, 0, 6.283); ctx.fill();   // comma-like dab
        if (rand() < 0.3) { ctx.fillStyle = css(c.map(v => clamp(v * 1.12 + 18, 0, 255)), 0.7); ctx.beginPath(); ctx.ellipse(x - 1, y - 1, s * 0.6, s * 0.15, a, 0, 6.283); ctx.fill(); }
      }
    }
    pass(14, 20, 9); pass(9, 14, 6); pass(6, 9.5, 3.5); pass(4.5, 6.5, 2, 0.6);
  }

  // ======================= MONDRIAN =======================
  if (STYLE === 'mondrian') {
    const RED = hex('#d4232b'), YEL = hex('#f6d02c'), BLU = hex('#1f3e9a'), WHT = hex('#f4f1ea'), GRY = hex('#d8d6d0'), BLK = hex('#111111');
    const BG = hex('#f2efe8'), VW = hex('#ffffff');
    // irregular column / row boundaries
    const cuts = (L, a, b) => { const v = [0]; let t = 0, k = 0; while (t < L) { t += a + hash(k++, L) * (b - a); v.push(Math.min(L, Math.round(t))); } return v; };
    const xs = cuts(W, 28, 70), ys = cuts(H, 28, 70), nx = xs.length - 1, ny = ys.length - 1, g = [];
    const toCol = p => {
      switch (p.k) {
        case PETAL: return p.role === 'c' ? YEL : RED;
        case STAMEN: return YEL; case BUD: return RED;
        case LEAF: case STEM: case SEPAL: return BLU;
        case VASE_B: return BLU; case VASE_W: return VW;
        case TABLE: return GRY; default: return BG;
      }
    };
    const key = c => c.join(',');
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const votes = {};
      for (let s2 = 0; s2 < 36; s2++) { const p = info(xs[i] + (s2 % 6 + 0.5) * (xs[i + 1] - xs[i]) / 6, ys[j] + (((s2 / 6) | 0) + 0.5) * (ys[j + 1] - ys[j]) / 6);
        const c = toCol(p); votes[key(c)] = (votes[key(c)] || 0) + (c === BG || c === GRY ? 1 : c === VW ? 1.3 : 1.5); }
      g.push(Object.entries(votes).sort((a, b) => b[1] - a[1])[0][0].split(',').map(Number));
    }
    const G = (i, j) => g[j * nx + i];
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) { ctx.fillStyle = css(G(i, j)); ctx.fillRect(xs[i], ys[j], xs[i + 1] - xs[i], ys[j + 1] - ys[j]); }
    ctx.fillStyle = css(BLK); const LW = 7;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const c = key(G(i, j));
      if (i + 1 < nx && key(G(i + 1, j)) !== c) ctx.fillRect(xs[i + 1] - LW / 2, ys[j] - LW / 2, LW, ys[j + 1] - ys[j] + LW);
      if (j + 1 < ny && key(G(i, j + 1)) !== c) ctx.fillRect(xs[i] - LW / 2, ys[j + 1] - LW / 2, xs[i + 1] - xs[i] + LW, LW);
    }
    // long structural lines and corner colour planes in the empty background
    const ty = ys.reduce((a, b) => Math.abs(b - meta.table_y) < Math.abs(a - meta.table_y) ? b : a);
    ctx.fillRect(0, ty - 5, W, 10);
    const X = k => xs[Math.min(nx, k)], Y = k => ys[Math.min(ny, k)];
    [[0, Y(3), X(6), Y(3)], [X(6), 0, X(6), Y(3)], [X(nx - 4), 0, X(nx - 4), Y(5)], [X(nx - 4), Y(5), W, Y(5)], [0, Y(ny - 8), X(4), Y(ny - 8)], [X(4), Y(ny - 8), X(4), ty]]
      .forEach(([x0, y0, x1, y1]) => ctx.fillRect(Math.min(x0, x1) - 4, Math.min(y0, y1) - 4, Math.abs(x1 - x0) + 8, Math.abs(y1 - y0) + 8));
    [[0, 0, X(6), Y(3), RED], [X(nx - 4), 0, W, Y(5), YEL], [0, Y(ny - 8), X(4), ty, BLU]].forEach(([x0, y0, x1, y1, c]) => {
      ctx.fillStyle = css(c); ctx.fillRect(x0 + 4, y0 + 4, x1 - x0 - 8, y1 - y0 - 8); });
    // paint texture
    ctx.globalAlpha = 0.04; for (let y = 0; y < H; y += 2) { ctx.fillStyle = rand() < 0.5 ? '#000' : '#fff'; ctx.fillRect(0, y, W, 1); } ctx.globalAlpha = 1;
  }

  // ======================= PICASSO (synthetic cubism) =======================
  if (STYLE === 'picasso') {
    const P = {
      wall: [hex('#b89a6a'), hex('#9a8262'), hex('#7a7468'), hex('#cdb488'), hex('#8a8a7a')],
      table: [hex('#7a5a3a'), hex('#5a4a3a'), hex('#9a7048')],
      vaseW: hex('#e8e0cc'), vaseB: hex('#3a5078'), leaf: [hex('#5a6a48'), hex('#40503e'), hex('#76805a')], stem: hex('#6a7a42'),
      bloom: { a: [hex('#b05a62'), hex('#d8968a')], b: [hex('#843030'), hex('#a84a3a')], c: [hex('#d8ccb4'), hex('#f0e6d0')] }, stamen: hex('#d8a83a'), bud: hex('#b04a5a'),
    };
    // facets: jittered-grid seeds, each with a dislocation offset and a light direction
    const cs = 95, gx = Math.ceil(W / cs) + 1, gy = Math.ceil(H / cs) + 1, seeds = [];
    for (let j = 0; j < gy; j++) for (let i = 0; i < gx; i++) seeds.push({ x: (i + hash(i, j, 1)) * cs, y: (j + hash(i, j, 2)) * cs,
      ox: (hash(i, j, 3) - 0.5) * 70, oy: (hash(i, j, 4) - 0.5) * 70, rot: (hash(i, j, 8) - 0.5) * 0.5, la: hash(i, j, 5) * 6.283, tone: 0.8 + hash(i, j, 6) * 0.4, alt: hash(i, j, 7) });
    const facetOf = (x, y) => { const i0 = Math.floor(x / cs), j0 = Math.floor(y / cs); let b = null, bd = 1e9, b2 = 1e9;
      for (let j = j0 - 1; j <= j0 + 1; j++) for (let i = i0 - 1; i <= i0 + 1; i++) { if (i < 0 || j < 0 || i >= gx || j >= gy) continue;
        const s = seeds[j * gx + i], d = Math.hypot(x - s.x, y - s.y);    // straight-edged polygons
        if (d < bd) { b2 = bd; bd = d; b = s; } else if (d < b2) b2 = d; }
      return { s: b, edge: b2 - bd }; };
    const img = ctx.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const { s, edge } = facetOf(x, y), cr = Math.cos(s.rot), sr = Math.sin(s.rot), rx = x - s.x, ry = y - s.y;
      const sx = s.x + rx * cr - ry * sr + s.ox, sy = s.y + rx * sr + ry * cr + s.oy, p = info(sx, sy);
      let c;
      switch (p.k) {
        case WALL: c = P.wall[Math.floor(s.alt * 5)]; break;
        case TABLE: c = P.table[Math.floor(s.alt * 3)]; break;
        case VASE_W: c = P.vaseW; break; case VASE_B: c = P.vaseB; break;
        case LEAF: case SEPAL: c = P.leaf[Math.floor(s.alt * 3)]; break; case STEM: c = P.stem; break;
        case STAMEN: c = P.stamen; break; case BUD: c = P.bud; break;
        case PETAL: { const B = P.bloom[p.role]; c = p.puff > 0.55 ? B[1] : B[0]; break; }
      }
      // planar shading across the facet (one side light, the other dark)
      const t = ((x - s.x) * Math.cos(s.la) + (y - s.y) * Math.sin(s.la)) / cs;
      c = shade(c, s.tone * (1 + clamp(t, -0.6, 0.6) * 0.45));
      // dislocated line art + facet edges
      const ink = inkAt(sx, sy);
      if (ink > 0.25) c = mix(c, hex('#1e1a16'), clamp(ink * 1.1));
      if (edge < 3) c = mix(c, s.alt > 0.5 ? hex('#2a241e') : hex('#f2ead8'), 0.7);
      // stippled dots on some facets (Picasso / Braque pointillist planes)
      if (s.alt > 0.82 && hash(x >> 2, y >> 2) < 0.18 && ((x & 3) < 2) && ((y & 3) < 2)) c = mix(c, hex('#f8f0e0'), 0.6);
      const o = (y * W + x) * 4; d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    ctx.globalAlpha = 0.04; for (let y = 0; y < H; y += 3) { ctx.fillStyle = rand() < 0.5 ? '#000' : '#fff'; ctx.fillRect(0, y, W, 1); } ctx.globalAlpha = 1;
  }
  window.DONE = true;
})();
</script></body></html>
