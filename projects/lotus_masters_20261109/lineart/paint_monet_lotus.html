<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script src="meta.js"></script>
<script>
// lotus pond, Monet
const meta = window.META;
const STYLE = new URLSearchParams(location.search).get('style') || 'monet';
const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
const px = im => { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); return x.getImageData(0, 0, im.width, im.height).data; };
let seed = 4242; const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rand(), clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), shade = (c, f) => c.map(v => clamp(v * f, 0, 255));
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const hash = (a, b, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
const pick = a => hex(a[(rand() * a.length) | 0]);
const WALL = 0, TABLE = 1, VASE_W = 2, VASE_B = 3, STEM = 4, LEAF = 5, PETAL = 6, STAMEN = 7, BUD = 8, SEPAL = 9;
const noise = (x, y) => Math.sin(x * 0.011 + Math.sin(y * 0.007) * 3) * Math.cos(y * 0.013 + Math.sin(x * 0.005) * 2);

(async () => {
  const [imC, imL] = await Promise.all(['cls.png', 'line.png'].map(load));
  const C = px(imC), Ln = px(imL), W = meta.W, H = meta.H;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const info = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const o = (y * W + x) * 4; return { k: C[o], bl: C[o + 1], puff: C[o + 2] / 255, role: (meta.blooms[C[o + 1] - 1] || [0, 0, 0, 0, 'a'])[4] }; };
  const inkAt = (x, y) => { x = clamp(x | 0, 0, W - 1); y = clamp(y | 0, 0, H - 1); const o = (y * W + x) * 4; return Ln[o] === 255 ? 0 : 1 - Ln[o + 1] / 255; };


  // ======================= MONET · LOTUS POND =======================
  // Water-lilies logic: the whole picture is a pond. Background = water with sky reflections and horizontal dabs;
  // blooms = pink/white with violet shadow and sunlit rims; leaves = lily pads with teal/violet/olive dabs.
  // The original ink lines are kept only as faint coloured structure so the lotus stays readable.
  const P = {
    wall: ['#a8bce0', '#b9aedc', '#98c4c4', '#c8d4ec', '#8aa8d4', '#b4d4c0', '#d8c8e4', '#cfe0e8'],
    sky:  ['#f8e8c8', '#fbe0d0', '#e8e0f0'],
    deep: ['#5a72b8', '#6a62a8', '#4a8a98', '#3a5a98'],
    water:['#9cc8dc', '#b0d4e4', '#7ab4c8', '#c8e0ec', '#a8b8e0'],
    porcelain: ['#f6f2f0', '#e8ecf6', '#f8f0e8', '#dcdcf0'], cobalt: ['#2f4fa8', '#3a5cb8', '#4a4a9c', '#2a6ab0', '#5a78c8'],
    leaf: ['#4a8a5a', '#6aa060', '#3a7a6a', '#8ab868', '#5a8aa0', '#a8c070', '#3c6a78'],
    stem: ['#4a8a48', '#5a9a58', '#3a7a5a', '#7aa858'], stamen: ['#f8d848', '#f0b840', '#fff0a0', '#e8c858'],
    pod: ['#9cb868', '#b8c878', '#88a860'],
    bloom: { a: ['#e88cb0', '#f4b0c8', '#fcd4e2', '#c878b0', '#fff0f4'], b: ['#f0a0bc', '#f8c0d0', '#e4a0c8', '#c888bc', '#fff4f6'] },
    bud: ['#e8709c', '#f4a0bc', '#d0609c', '#fcc8d8'],
  };
  const LINECOL = { [PETAL]: '#8a3a78', [BUD]: '#8a3a78', [STAMEN]: '#8a6a20', [LEAF]: '#1a4a3a', [STEM]: '#2a5a3a', [SEPAL]: '#2a5a3a', [VASE_W]: '#4a5aa0', [VASE_B]: '#3a4a98', [TABLE]: '#3a6a98', [WALL]: '#6a7ab0' };
  function color(p, x, y) {
    const lit = clamp(0.5 - (x / W - 0.5) * 0.6 - (y / H - 0.5) * 0.6);
    switch (p.k) {
      case WALL: { const t = y / H; const nz = noise(x * 1.3, y * 1.3), nz2 = noise(x * 0.5 + 300, y * 0.7);
        if (nz > 0.35 && rand() < 0.3) return pick(['#6a86c4', '#5a74b8', '#7a8ccc']);          // deeper water bands
        if (nz2 < -0.4 && rand() < 0.5) return pick(['#f0d8e0', '#e8e4f4', '#d4ecd8']);         // pale reflected sky / pink light
        if (Math.abs(nz) < 0.06 && rand() < 0.5) return pick(['#4a8a8a', '#5a9a7a']);            // dark-green reflection streaks // sky glow high, deep water low, with a lily-pad dab here and there
        if (rand() < 0.04 + 0.05 * (1 - t)) return mix(hex('#6aa070'), hex('#8ab090'), rand());
        return t < 0.3 ? mix(pick(P.wall), pick(P.sky), (0.3 - t) * 1.8 * rand()) : t > 0.82 ? mix(pick(P.wall), pick(P.deep), (t - 0.82) * 3.5 * rand()) : pick(P.wall); }
      case TABLE: return rand() < 0.15 ? hex('#fff6f0') : pick(P.water);
      case VASE_W: { const dx = (x - meta.vase.cx) / 190; return dx < -0.2 && rand() < 0.4 ? hex('#fffaf0') : dx > 0.3 && rand() < 0.5 ? hex('#c8c0e8') : pick(P.porcelain); }
      case VASE_B: return rand() < 0.1 + 0.2 * lit * (1 - p.puff) ? hex('#cfd8f4') : pick(P.cobalt);
      case STEM: return pick(P.stem);
      case SEPAL: return pick(P.pod);
      case LEAF: { const r = rand();
        if (p.puff < 0.3 && r < 0.45) return hex(rand() < 0.5 ? '#2c6a6a' : '#5a5aa0');       // shaded veins side
        if (r < 0.08) return hex('#7a8ad0');                                                   // sky reflected on the pad
        return mix(pick(P.leaf), hex('#e8f0a0'), lit * 0.35 * p.puff); }
      case STAMEN: return pick(P.stamen);
      case BUD: return pick(P.bud);
      case PETAL: { const B = P.bloom[p.role]; const r = rand();
        if (p.puff < 0.38 && r < 0.75) return mix(hex(B[3]), hex('#7a5aa8'), 0.25);
        if (p.puff > 0.62 && r < 0.5 + lit * 0.4) return hex(B[4]);
        return mix(hex(B[(rand() * 3) | 0]), hex('#fff0e8'), lit * 0.25); }
    }
    return [0, 0, 0];
  }
  ctx.fillStyle = '#b8c4e4'; ctx.fillRect(0, 0, W, H);
  const puffAt = (xx, yy) => info(xx, yy).puff;
  function pass(sp, sz, jit, keep = 1, only = null) {
    const list = [];
    for (let y = 0; y < H; y += sp) for (let x = 0; x < W; x += sp) if (rand() < keep) list.push([x + R(-sp, sp), y + R(-sp, sp)]);
    for (let i = list.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
    for (const [x, y] of list) {
      const p0 = info(x, y); if (only && !only.includes(p0.k)) continue;
      const jj = p0.k === STEM || p0.k === STAMEN ? jit * 0.3 : jit;
      const p = info(x + R(-jj, jj), y + R(-jj, jj));
      const c = color(p, x, y).map(v => clamp(v + R(-12, 12), 0, 255));
      let a;
      if (p.k === WALL || p.k === TABLE) a = R(-0.12, 0.12) + (p.k === WALL && rand() < 0.25 ? R(-0.5, 0.5) : 0);       // pond water: horizontal strokes
      else if (p.k === LEAF) { const gx = puffAt(x + 3, y) - puffAt(x - 3, y), gy = puffAt(x, y + 3) - puffAt(x, y - 3);
        a = Math.abs(gx) + Math.abs(gy) > 1e-3 ? Math.atan2(gy, gx) + Math.PI / 2 + R(-0.4, 0.4) : R(-0.3, 0.3); }
      else { const gx = puffAt(x + 3, y) - puffAt(x - 3, y), gy = puffAt(x, y + 3) - puffAt(x, y - 3);
             a = Math.abs(gx) + Math.abs(gy) > 1e-3 ? Math.atan2(gy, gx) + Math.PI / 2 + R(-0.3, 0.3) : R(0, 6.28); }
      const wide = p.k === WALL || p.k === TABLE;
      const s = sz * (p.k === PETAL || p.k === STAMEN ? 0.7 : p.k === STEM ? 0.8 : p.k === SEPAL ? 0.55 : p.k === VASE_B ? 0.6 : wide ? 1.15 : 1) * R(0.7, 1.3);
      ctx.fillStyle = css(c, R(0.75, 0.95));
      ctx.beginPath(); ctx.ellipse(x, y, s, s * (wide ? R(0.22, 0.34) : R(0.28, 0.42)), a, 0, 6.283); ctx.fill();
      if (rand() < 0.3) { ctx.fillStyle = css(c.map(v => clamp(v * 1.12 + 18, 0, 255)), 0.7); ctx.beginPath(); ctx.ellipse(x - 1, y - 1, s * 0.6, s * 0.15, a, 0, 6.283); ctx.fill(); }
    }
  }
  pass(14, 20, 9); pass(9, 14, 6); pass(6, 9.5, 3); pass(4.5, 6.5, 1.2, 0.7);
  pass(4, 6, 0.6, 0.9, [STEM, STAMEN, SEPAL, BUD]); pass(3, 4.5, 0.4, 0.9, [STEM]);                       // small dabs: keep stems, pods and the bud legible
  // lily-pad ripples on the water: a few pale elliptical rings near the bowl rim and under the pads
  ctx.lineWidth = 1.6; for (let i = 0; i < 7; i++) { ctx.strokeStyle = css([255, 250, 240], 0.35); ctx.beginPath(); ctx.ellipse(500 + R(-60, 60), 1115 + R(-6, 6), 30 + i * 12, 4 + i * 1.6, 0, 0, 6.283); ctx.stroke(); }
  // ink lines -> faint coloured structure
  { const img = ctx.getImageData(0, 0, W, H), d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const o = (y * W + x) * 4; if (Ln[o] === 255) continue;
      const ink = 1 - Ln[o + 1] / 255; if (ink < 0.05) continue;
      const k = Ln[o], lc = hex(LINECOL[k] || '#4a5a98'), al = clamp(ink * (k === WALL ? 0.0 : k === LEAF ? 1.7 : k === STEM ? 1.4 : k === PETAL ? 0.7 : 0.8), 0, 0.85);
      d[o] = d[o] + (lc[0] - d[o]) * al; d[o + 1] = d[o + 1] + (lc[1] - d[o + 1]) * al; d[o + 2] = d[o + 2] + (lc[2] - d[o + 2]) * al; }
    ctx.putImageData(img, 0, 0); }
  ctx.globalAlpha = 0.035; for (let y = 0; y < H; y += 3) { ctx.fillStyle = rand() < 0.5 ? '#000' : '#fff'; ctx.fillRect(0, y, W, 1); } ctx.globalAlpha = 1;
  window.DONE = true;
})();
</script></body></html>
