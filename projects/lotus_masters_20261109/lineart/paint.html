<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script src="meta.js"></script>
<script>
// Van Gogh "Sunflowers"-style painting over the supplied line art.
// Bristle-brush strokes (striated, tapered, varied), hatched background patches,
// thick broken coloured contours. Region maps from lineart_prep.py.
const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
const px = im => { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); return x.getImageData(0, 0, im.width, im.height).data; };
let seed = 777; const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const R = (a, b) => a + (b - a) * rand(), clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), shade = (c, f) => c.map(v => clamp(v * f, 0, 255));
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const WALL = 0, TABLE = 1, VASE_W = 2, VASE_B = 3, STEM = 4, LEAF = 5, PETAL = 6, STAMEN = 7, BUD = 8, SEPAL = 9;
const pickH = a => hex(a[(rand() * a.length) | 0]);

const PAL = {
  // chrome yellow wall with lemon, ochre and a touch of green, as in the Sunflowers backgrounds
  wall: ['#f0c23a', '#f6d45a', '#e2a92a', '#f9e27a', '#d99a22', '#e8c84e', '#c8b848'],
  table: ['#dba63c', '#e6b84e', '#c88e2c', '#efc65e', '#b87a24'],   // yellow-ochre table, as in the Sunflowers
  porcelain: ['#f6efdc', '#ece2c6', '#fdf9ec', '#e6e4d8', '#f2e6c8'], cobalt: ['#21439a', '#1a3786', '#2f56aa', '#3a62b4'],
  leaf: ['#2c5a2a', '#4a7a30', '#1c3c22', '#7ea444', '#3a6a48', '#a8b84a'],
  stem: ['#8aa83a', '#a8bc4a', '#6e9a32', '#c2c858'], sepal: ['#4f7a2e', '#7a9a3c', '#2f5a28'],   // stems: yellow-green, distinct from the dark leaves
  bloom: {  // hollow, body, light, highlight
    a: ['#8a1f4a', '#dc5a86', '#f4a2bc', '#ffe0ea'],    // top: peony pink
    b: ['#5a0a16', '#bf2634', '#e86058', '#ffb09a'],    // left: deep red
    c: ['#b88058', '#f2d4be', '#fff2e4', '#ffffff'],    // lower right: white with blush
  },
  bud: ['#6a1028', '#c83a62', '#ee86a0', '#ffc0cc'],
  stamen: ['#f6c020', '#e89a10', '#ffe070', '#b8700c', '#f0d040'],
};

(async () => {
  const meta = window.META;
  const [imC, imI, imL, imF] = await Promise.all(['cls.png', 'cid.png', 'line.png', 'flow.png'].map(load));
  const C = px(imC), I = px(imI), Ln = px(imL), F = px(imF), W = meta.W, H = meta.H, blooms = meta.blooms;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const at = (x, y) => { x = x | 0; y = y | 0; return (x < 0 || y < 0 || x >= W || y >= H) ? -1 : (y * W + x) * 4; };
  const info = (x, y) => { const o = at(x, y); if (o < 0) return null;
    return { k: C[o], bl: C[o + 1], puff: C[o + 2] / 255, id: I[o] | (I[o + 1] << 8) | (I[o + 2] << 16) }; };
  const puffAt = (x, y) => { const o = at(x, y); return o < 0 ? 0 : C[o + 2] / 255; };
  const noise = (x, y) => Math.sin(x * 0.011 + Math.sin(y * 0.007) * 3) * Math.cos(y * 0.013 + Math.sin(x * 0.005) * 2);

  function color(p, x, y) {
    switch (p.k) {
      case WALL: {   // Sunflowers (1888): saturated chrome yellow ground, gently varied
        let c = mix(hex('#eec23a'), hex('#f4d052'), 0.5 + 0.5 * noise(x * 0.7, y * 0.7));
        const r = rand();
        if (r < 0.2) c = mix(c, hex('#f8dc6a'), 0.6);             // lighter chrome
        else if (r < 0.36) c = mix(c, hex('#e2a82a'), 0.6);       // deep chrome / ochre
        else if (r < 0.42) c = mix(c, hex('#d2c050'), 0.5);       // touch of green
        else if (r < 0.48) c = mix(c, hex('#e89a26'), 0.45);      // warm orange
        return c; }
      case TABLE: { const c = mix(pickH(PAL.table), hex(PAL.table[0]), 0.35);
        const sh = Math.exp(-(((x - 640) / 170) ** 2) - (((y - 1405) / 28) ** 2)); return mix(c, hex('#8a6a2a'), sh * 0.55); }
      case VASE_W: { const dx = (x - meta.vase.cx) / 190;
        let c = mix(pickH(PAL.porcelain), hex('#f2c860'), clamp(dx * 0.7) * 0.35);              // yellow wall reflected
        if (dx < -0.2) c = mix(c, hex('#c8d2e8'), clamp(-dx - 0.6) * 0.5);                     // cool shadow side
        c = mix(c, [255, 254, 248], Math.exp(-(((dx + 0.42) / 0.12) ** 2)) * 0.6);              // glaze highlight
        return shade(c, 1 - Math.pow(Math.min(1, Math.abs(dx)), 2.5) * 0.25); }
      case VASE_B: return shade(pickH(PAL.cobalt), 1.05 - Math.abs((x - meta.vase.cx) / 190) * 0.25);
      case STEM: return pickH(PAL.stem);
      case SEPAL: return mix(pickH(PAL.sepal), hex(PAL.sepal[1]), p.puff * 0.5);
      case LEAF: { let c = mix(hex(PAL.leaf[2]), hex(PAL.leaf[1]), clamp(p.puff * 1.2));
        c = mix(c, pickH(PAL.leaf), 0.35); if (rand() < 0.12) c = mix(c, hex(PAL.leaf[5]), 0.5); return c; }
      case BUD: { const b = PAL.bud; const c = mix(hex(b[0]), hex(b[1]), clamp(p.puff * 1.5)); return mix(c, hex(b[2]), clamp((p.puff - 0.5) * 2) * 0.7); }
      case STAMEN: return pickH(PAL.stamen);
      case PETAL: {
        const bx = blooms[p.bl - 1], B = PAL.bloom[(bx || [0, 0, 0, 0, 'a'])[4]];
        const dh = bx ? Math.hypot((x - bx[0]) / bx[2], (y - bx[1]) / bx[3]) : 0.6;
        let c = mix(hex(B[0]), hex(B[1]), clamp(0.1 + p.puff * 1.5));                   // dark at each petal's rim crease
        c = mix(c, hex(B[2]), clamp((p.puff - 0.45) * 1.8) * 0.8);                       // swelling, rolled middle catches light
        c = mix(c, hex(B[0]), clamp(0.5 - dh) * 0.5);                                    // deeper in the cup
        if (p.puff > 0.72 && rand() < 0.45) c = mix(c, hex(B[3]), 0.6);                 // thick light impasto
        if (rand() < 0.06) c = mix(c, hex('#f6c040'), 0.35);                             // warm reflected flecks
        return c;
      }
    }
    return [0, 0, 0];
  }
  // Sunflowers-style background: small patches of parallel hatching, direction changing patch to patch
  // Van Gogh background (Starry Night rhythm in warm yellows):
  //  - four spiralling vortices with glowing eyes in the empty corners
  //  - parallel ribbons circling the bouquet
  //  - a rolling wave flow in between
  const LANES = ['#f8de62', '#f0c23c', '#e0a228', '#f4cf4c', '#fbe98c', '#d68e20', '#eebc3a', '#c9b44a', '#f6d65a', '#e4ac30'];
  const VX = [[150, 150, 170, 1], [945, 150, 165, -1], [140, 1120, 150, -1], [950, 1110, 150, 1], [1010, 470, 95, 1]];
  function bgField(x, y) {
    const o = at(x, y), d = o < 0 ? 300 : F[o + 1] * 2, tan = o < 0 ? 0 : F[o] / 255 * 2 * Math.PI - Math.PI;
    let best = null;
    for (const [cx, cy, R0, sg] of VX) { const r = Math.hypot(x - cx, y - cy); if (r < R0 * 1.25 && (!best || r / R0 < best.q)) best = { cx, cy, R0, sg, r, q: r / R0 }; }
    if (best && best.q < 1.25 && d > 22) {
      const a = Math.atan2(y - best.cy, x - best.cx) + best.sg * (Math.PI / 2 + 0.22);      // tangent, spiralling inwards
      return { ang: a, lane: best.r + 6 * Math.sin(Math.atan2(y - best.cy, x - best.cx) * 3), core: Math.max(0, 1 - best.r / (best.R0 * 0.3)), vortex: true };
    }
    const near = Math.exp(-d / 110);
    const wave = 0.55 * Math.sin(x * 0.0065 + y * 0.002) + 0.25 * Math.sin(y * 0.009 - x * 0.003);   // rolling waves
    let vx = Math.cos(wave), vy = Math.sin(wave);
    const tx = Math.cos(tan), ty = Math.sin(tan), sg = tx * vx + ty * vy < 0 ? -1 : 1;
    vx = vx * (1 - near) + tx * sg * near; vy = vy * (1 - near) + ty * sg * near;
    const laneWave = y + 45 * Math.sin(x * 0.0065 + y * 0.002) * 1.6;
    return { ang: Math.atan2(vy, vx), lane: near > 0.35 ? d : laneWave * (1 - near) + d * near, core: 0, vortex: false };
  }
  // short strokes crossing on two diagonals, alternating in small cells -> woven texture
  function wallAngle(x, y) {
    const cs = 26, cx = Math.floor(x / cs), cy = Math.floor(y / cs);
    const h = Math.sin(cx * 127.1 + cy * 311.7) * 43758.5453, f = h - Math.floor(h);
    return (f < 0.5 ? -0.95 : 0.75) + (f - 0.5) * 0.5;
  }
  function angle(p, x, y) {
    if (p.k === WALL) return wallAngle(x, y);
    if (p.k === TABLE) return 0.06 * Math.sin(x * 0.02) + R(-0.08, 0.08);
    if (p.k === STAMEN) return R(0, 6.28);
    const e = 3, gx = puffAt(x + e, y) - puffAt(x - e, y), gy = puffAt(x, y + e) - puffAt(x, y - e);
    const a0 = meta.angle[p.id];
    if (p.k === LEAF || p.k === SEPAL) {                                   // veins: from the midrib outwards at an angle
      if (a0 === undefined || Math.abs(gx) + Math.abs(gy) < 1e-3) return a0 ?? R(0, 6.28);
      const g = Math.atan2(gy, gx); return a0 + 0.55 * Math.sin(g - a0);
    }
    if (p.k === STEM) return a0 ?? Math.atan2(gy, gx) + Math.PI / 2;
    if (p.k === VASE_W || p.k === VASE_B) return Math.PI / 2 + Math.atan((x - meta.vase.cx) / 260) + R(-0.15, 0.15);  // wrap the belly
    if (Math.abs(gx) + Math.abs(gy) < 1e-3) return R(0, 6.28);
    return Math.atan2(gy, gx) + Math.PI / 2 + R(-0.12, 0.12);              // petals: follow the curled rims
  }

  // ---- bristle brush: several striations with their own tone, tapered at both ends
  function brush(pts, wid, col, alpha = 1) {
    const n = Math.max(3, Math.round(wid / 2.2));
    const nrm = pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
      const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [-dy / l, dx / l]; });
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    // darker under-layer offset = the raised edge of a thick stroke
    ctx.strokeStyle = css(shade(col, 0.8), 0.45 * alpha); ctx.lineWidth = wid;
    ctx.beginPath(); pts.forEach((p, i) => { const q = [p[0] + wid * 0.12, p[1] + wid * 0.15]; i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke();
    for (let b = 0; b < n; b++) {
      const off = (b / (n - 1) - 0.5) * wid * 0.85;
      const tone = b === 0 ? 0.82 : b === n - 1 ? 1.18 : R(0.9, 1.1);            // shadow side .. ridge-highlight side
      const c = col.map(v => clamp(v * tone + R(-10, 10) + (b === n - 1 ? 14 : 0), 0, 255));
      ctx.strokeStyle = css(c, alpha * R(0.75, 1)); ctx.lineWidth = Math.max(1, wid / n * 1.5);
      const start = rand() < 0.3 ? 1 : 0, end = pts.length - (rand() < 0.3 ? 1 : 0);   // bristles end unevenly
      if (end - start < 2) continue;
      ctx.beginPath();
      for (let i = start; i < end; i++) {
        const taper = Math.pow(Math.sin(Math.PI * (i + 0.5) / pts.length), 0.4);
        const x = pts[i][0] + nrm[i][0] * off * taper, y = pts[i][1] + nrm[i][1] * off * taper;
        i === start ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  function stroke(x0, y0, len, wid, p) {
    const col = color(p, x0, y0).map(v => clamp(v + R(-12, 12), 0, 255));
    const pts = [[x0, y0]]; let x = x0, y = y0; const steps = p.k === WALL ? 3 : 6;
    for (let s = 0; s < steps; s++) {
      const q = info(x, y); if (!q) break;
      const a = angle(q, x, y); x += Math.cos(a) * len / steps; y += Math.sin(a) * len / steps;
      const r = info(x, y); if (!r) break;
      if (p.k <= TABLE ? r.k !== p.k : (r.id !== p.id && r.k !== p.k)) break;    // stay inside the shape
      pts.push([x, y]);
    }
    if (pts.length < 3) return;
    brush(pts, wid, col);
  }
  const SIZE = { [WALL]: [1.0, 1.0], [TABLE]: [1.6, 1.2], [VASE_W]: [0.8, 0.95], [VASE_B]: [0.35, 0.5], [STEM]: [1.2, 0.55],
                 [LEAF]: [0.85, 0.85], [PETAL]: [0.7, 0.9], [STAMEN]: [0.22, 0.55], [BUD]: [0.55, 0.75], [SEPAL]: [0.5, 0.6] };
  function pass(sp, len, wid, only = null, keep = 1) {
    const list = [];
    for (let y = 0; y < H; y += sp) for (let x = 0; x < W; x += sp) {
      if (rand() > keep) continue;
      const xx = x + R(-sp, sp) * 0.6, yy = y + R(-sp, sp) * 0.6, p = info(xx, yy); if (!p) continue;
      if (only && !only.includes(p.k)) continue;
      list.push([xx, yy, p]);
    }
    for (let i = list.length - 1; i > 0; i--) { const j = (rand() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
    list.sort((a, b) => (a[2].k <= TABLE ? 0 : 1) - (b[2].k <= TABLE ? 0 : 1));
    list.forEach(([x, y, p]) => { const s = SIZE[p.k] || [1, 1]; stroke(x, y, len * s[0] * R(0.7, 1.35), wid * s[1] * R(0.75, 1.3), p); });
  }

  // flat underpainting (warm, slightly darker: shows through gaps between strokes)
  {
    const img0 = ctx.createImageData(W, H), d0 = img0.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const o = (y * W + x) * 4, k = C[o];
      const c = shade(color({ k, bl: C[o + 1], puff: C[o + 2] / 255 * 0.6, id: 1 }, x, y), 0.82);
      d0[o] = c[0]; d0[o + 1] = c[1]; d0[o + 2] = c[2]; d0[o + 3] = 255;
    }
    ctx.putImageData(img0, 0, 0);
  }
  pass(14, 40, 13, [TABLE]); pass(12, 30, 11, [WALL]); pass(8, 24, 9, [WALL]); pass(6, 18, 7, [WALL], 0.7);
  pass(13, 40, 14, [VASE_W, LEAF, PETAL, BUD, STEM]);
  pass(8, 28, 10, [VASE_W, LEAF, PETAL, BUD, STEM, SEPAL, STAMEN]);
  pass(5.5, 18, 7, [PETAL, BUD, LEAF, SEPAL, STEM, STAMEN, VASE_B]);
  pass(3.2, 9, 4, [VASE_B, STAMEN]);
  pass(6, 14, 6, [PETAL], 0.35);                                           // final thick light dabs on the petals

  // ---- contours: thick, broken, coloured brush lines (from the line art)
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const LC = { [LEAF]: hex('#14304a'), [STEM]: hex('#1a3a2a'), [SEPAL]: hex('#1a3a2a'), [BUD]: hex('#4a0a1a'),
               [VASE_W]: hex('#1c3c96'), [VASE_B]: hex('#1c3c96'), [STAMEN]: hex('#9a5208'), [WALL]: hex('#3a4a7a'), [TABLE]: hex('#5a2a0a') };
  const ink = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) ink[i] = Ln[i * 4] === 255 ? 0 : 1 - Ln[i * 4 + 1] / 255;
  const ink2 = new Float32Array(W * H);                                   // ~1px heavier line
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x;
    ink2[i] = Math.max(ink[i], 0.6 * Math.max(ink[i - 1], ink[i + 1], ink[i - W], ink[i + W])); }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x, o = i * 4, v = ink2[i]; if (v < 0.12) continue;
    let k = Ln[o]; if (k === 255) { const nb = [o - 4, o + 4, o - W * 4, o + W * 4].find(q => Ln[q] !== 255); k = nb !== undefined ? Ln[nb] : C[o]; }
    let lc = LC[k];
    if (k === PETAL) { const B = PAL.bloom[(blooms[C[o + 1] - 1] || [0, 0, 0, 0, 'a'])[4]]; lc = shade(hex(B[0]), 0.7); }
    if (!lc) lc = [40, 30, 30];
    const brk = 0.85 + 0.25 * Math.sin(x * 0.09 + Math.sin(y * 0.05) * 4) * Math.sin(y * 0.11 + x * 0.02);   // uneven brush pressure
    const a = clamp(v * 1.35 * brk) * 0.95;
    d[o] = d[o] * (1 - a) + lc[0] * a; d[o + 1] = d[o + 1] * (1 - a) + lc[1] * a; d[o + 2] = d[o + 2] * (1 - a) + lc[2] * a;
  }
  ctx.putImageData(img, 0, 0);
  // the blue line dividing wall and table, as in the Sunflowers
  { const ty = meta.table_y; ctx.lineCap = 'round';
    for (let x = 0; x < W; x += 20) {
      if (rand() < 0.08) continue;
      const p = info(x + 10, ty); if (!p || (p.k !== WALL && p.k !== TABLE)) continue;
      ctx.strokeStyle = css(rand() < 0.5 ? hex('#2a4aa8') : hex('#3a62b8'), 0.9); ctx.lineWidth = R(4, 7);
      ctx.beginPath(); ctx.moveTo(x, ty + R(-2, 2)); ctx.lineTo(x + R(20, 26), ty + R(-2, 2)); ctx.stroke();
    } }
  pass(16, 18, 6, [WALL, VASE_W], 0.08);                      // loose strokes over the contours
  ctx.globalAlpha = 0.03;                                                  // canvas weave
  for (let y = 0; y < H; y += 4) { ctx.fillStyle = rand() < 0.5 ? '#000' : '#fff'; ctx.fillRect(0, y, W, 1.3); }
  for (let x = 0; x < W; x += 4) { ctx.fillStyle = rand() < 0.5 ? '#000' : '#fff'; ctx.fillRect(x, 0, 1.3, H); }
  ctx.globalAlpha = 1;
  window.DONE = true;
})();
</script></body></html>
