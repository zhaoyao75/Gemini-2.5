<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body><canvas id="c"></canvas>
<script src="meta.js"></script>
<script>
// Decorative / flat styles over the shared line art: ?style=klimt | matisse
const meta = window.META;
const STYLE = new URLSearchParams(location.search).get('style') || 'klimt';
const load = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.src = src; });
const px = im => { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0); return x.getImageData(0, 0, im.width, im.height).data; };
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), shade = (c, f) => c.map(v => clamp(v * f, 0, 255));
const hash = (a, b, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
const frac = x => x - Math.floor(x);
const WALL = 0, TABLE = 1, VASE_W = 2, VASE_B = 3, STEM = 4, LEAF = 5, PETAL = 6, STAMEN = 7, BUD = 8, SEPAL = 9;
const noise = (x, y) => Math.sin(x * 0.011 + Math.sin(y * 0.007) * 3) * Math.cos(y * 0.013 + Math.sin(x * 0.005) * 2);

// ================= KLIMT: gold leaf, spirals, eyes, mosaic =================
const KLIMT = (() => {
  const H_ = hex;
  const gold = [H_('#b8862a'), H_('#d9a842'), H_('#efcf6a'), H_('#a27424')];
  const motifs = [];
  function setup(info, W, H) {
    // scatter spirals and eye-circles on the wall, away from the bouquet
    let k = 0;
    for (let t = 0; t < 900 && motifs.length < 42; t++) {
      const x = hash(t, 1) * W, y = hash(t, 2) * Math.min(meta.table_y - 30, 1040), p = info(x, y);
      if (!p || p.k !== WALL) continue;
      const kind = t % 3 === 0 ? 'eye' : 'spiral', R = kind === 'eye' ? 20 + hash(t, 3) * 16 : 34 + hash(t, 4) * 40;
      if (motifs.some(m => Math.hypot(m.x - x, m.y - y) < m.R + R + 6)) continue;
      // keep motifs fully on the wall
      let ok = true; for (let a = 0; a < 6.28 && ok; a += 0.7) { const q = info(x + Math.cos(a) * R, y + Math.sin(a) * R); ok = q && q.k === WALL; }
      if (ok) motifs.push({ x, y, R, kind, sg: hash(t, 5) < 0.5 ? 1 : -1 });
    }
  }
  function wall(x, y) {
    // metallic leaf: warm gold, cracked into small irregular sheets
    const cx = Math.floor(x / 34 + 0.3 * Math.sin(y / 40)), cy = Math.floor(y / 34), h = hash(cx, cy);
    let c = mix(gold[0], gold[2], 0.35 + 0.45 * h + 0.15 * noise(x, y));
    c = shade(c, 0.92 + 0.16 * hash(x | 0, y | 0));                      // grain
    // small rectangles mosaic band near the top and sides
    for (const m of motifs) {
      const dx = x - m.x, dy = y - m.y, r = Math.hypot(dx, dy); if (r > m.R) continue;
      if (m.kind === 'spiral') {              // Tree-of-Life spiral: dark bronze line on brighter gold
        const th = Math.atan2(dy, dx) * m.sg, ph = frac(r / 9 - th / (2 * Math.PI));
        return ph < 0.28 ? H_('#4a2e0c') : mix(gold[2], H_('#f6e0a0'), 0.4);
      }
      // eye motif: concentric rings of black, silver, red, gold
      const ring = Math.floor(r / (m.R / 5));
      return [H_('#1a1410'), H_('#f2efe6'), H_('#b8442a'), H_('#cfd2cc'), H_('#2a1e14')][ring % 5];
    }
    return c;
  }
  function table(x, y) {   // black ground with gold / silver / red / white rectangles (the Kiss)
    const cw = 22, ch = 34, ox = Math.floor(y / ch) % 2 ? cw / 2 : 0;
    const cx = Math.floor((x + ox) / cw), cy = Math.floor(y / ch), lx = (x + ox) - cx * cw, ly = y - cy * ch, h = hash(cx, cy, 9);
    if (lx < 3 || ly < 3) return H_('#120e0a');
    const pal = [H_('#d9a842'), H_('#efcf6a'), H_('#cfd2cc'), H_('#f2efe6'), H_('#b8442a'), H_('#1a1410'), H_('#d9a842')];
    return h < 0.12 ? H_('#120e0a') : pal[Math.floor(h * pal.length)];
  }
  const BL = { a: [H_('#c2306a'), H_('#e8689a'), H_('#f7a8c4')], b: [H_('#8a1424'), H_('#c8343a'), H_('#e8705c')], c: [H_('#d8c8b0'), H_('#f4ece0'), H_('#ffffff')] };
  function color(p, x, y) {
    switch (p.k) {
      case WALL: return wall(x, y);
      case TABLE: return table(x, y);
      case VASE_W: { const dx = (x - meta.vase.cx) / 190; let c = mix(H_('#f6f0e0'), H_('#e8dcc0'), clamp(Math.abs(dx)));
        return mix(c, H_('#fffef8'), Math.exp(-(((dx + 0.4) / 0.12) ** 2)) * 0.5); }
      case VASE_B: return H_('#1f3c98');
      case STEM: return H_('#7a8a2a');
      case SEPAL: return H_('#4a7a2e');
      case LEAF: { const c = p.puff > 0.55 ? H_('#4f8a3a') : H_('#2e6230');            // flat, two tones
        return hash(Math.floor(x / 7), Math.floor(y / 7), 3) < 0.07 ? H_('#d9a842') : c; }  // gold flecks
      case BUD: return p.puff > 0.5 ? H_('#e8689a') : H_('#b02a5a');
      case STAMEN: return hash(Math.floor(x / 4), Math.floor(y / 4)) < 0.5 ? H_('#f2c43a') : H_('#c88a1a');
      case PETAL: {
        const bx = meta.blooms[p.bl - 1], B = BL[(bx || [0, 0, 0, 0, 'a'])[4]];
        let c = p.puff < 0.3 ? B[0] : p.puff < 0.68 ? B[1] : B[2];                      // flat bands
        // Klimt garden dots: small circles on a grid, lighter or gold
        const g = 10, gx = Math.floor(x / g), gy = Math.floor(y / g), h = hash(gx, gy, 7);
        const d = Math.hypot(x - (gx + 0.5) * g, y - (gy + 0.5) * g);
        if (h < 0.45 && d < 2.6) c = h < 0.15 ? H_('#e8bf4a') : mix(c, H_('#ffffff'), 0.55);
        return c;
      }
    }
    return [0, 0, 0];
  }
  return { setup, color, line: k => k === VASE_W || k === VASE_B ? H_('#a87a22') : H_('#3a240c'), lineW: 1, grain: 0.03 };
})();

// ================= MATISSE: "Harmony in Red" =================
const MATISSE = (() => {
  const H_ = hex, red = H_('#c3242c'), blue = H_('#24429a');
  function pattern(x, y) {   // blue arabesque wallpaper: wavy vines, leaves, flower baskets
    const row = 170, k = Math.floor((y + 40) / row);
    for (let kk = k - 1; kk <= k + 1; kk++) {
      const yk = kk * row + 38 * Math.sin(x * 0.018 + kk * 1.7);
      if (Math.abs(y - yk) < 3.2) return true;                                         // vine
      const lx = 70, i = Math.round((x - kk * 35) / lx), cx = i * lx + kk * 35, cyk = kk * row + 38 * Math.sin(cx * 0.018 + kk * 1.7);
      const side = i % 2 ? 1 : -1, ex = x - cx - 8, ey = y - (cyk + side * 16), a = side * 0.6;
      const qx = ex * Math.cos(a) + ey * Math.sin(a), qy = -ex * Math.sin(a) + ey * Math.cos(a);
      if ((qx / 17) ** 2 + (qy / 7) ** 2 < 1) return true;                             // leaf
      const fx = 230, j = Math.round((x - kk * 115) / fx), fcx = j * fx + kk * 115, fcy = kk * row + 85;
      const dx = x - fcx, dy = y - fcy, r = Math.hypot(dx, dy), th = Math.atan2(dy, dx);
      if (r < 30 * (0.62 + 0.38 * Math.cos(5 * th))) return r > 7 || true;            // rosette flower
      if (Math.abs(dy - 38) < 14 && Math.abs(dx) < 26 - (dy - 24) * 0.4 && dy > 24) return true;   // little basket
    }
    return false;
  }
  const BL = { a: [H_('#e8507e'), H_('#f78fb0')], b: [H_('#7a2a8a'), H_('#a85ab8')], c: [H_('#f6eee2'), H_('#fffaf2')] };
  function color(p, x, y) {
    const tex = 1 + 0.035 * noise(x * 2.2, y * 2.2);                                   // gouache unevenness
    switch (p.k) {
      case WALL: return shade(pattern(x, y) ? blue : red, tex);
      case TABLE: return shade(pattern(x + 60, y + 30) ? blue : H_('#b01c26'), tex);
      case VASE_W: return shade(H_('#f8f4ea'), tex);
      case VASE_B: return shade(blue, tex);
      case STEM: return shade(H_('#4aa83a'), tex);
      case SEPAL: return shade(H_('#2a8a46'), tex);
      case LEAF: return shade(p.puff > 0.6 ? H_('#3aa84e') : H_('#16804a'), tex);
      case BUD: return shade(H_('#e8507e'), tex);
      case STAMEN: return shade(H_('#f7d21c'), tex);
      case PETAL: { const bx = meta.blooms[p.bl - 1], B = BL[(bx || [0, 0, 0, 0, 'a'])[4]]; return shade(p.puff > 0.62 ? B[1] : B[0], tex); }
    }
    return [0, 0, 0];
  }
  return { setup() {}, color, line: () => H_('#161a38'), lineW: 2, grain: 0.02 };
})();

(async () => {
  const S = STYLE === 'matisse' ? MATISSE : KLIMT;
  const [imC, imI, imL] = await Promise.all(['cls.png', 'cid.png', 'line.png'].map(load));
  const C = px(imC), Ln = px(imL), W = meta.W, H = meta.H;
  const cv = document.getElementById('c'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  const info = (x, y) => { x = x | 0; y = y | 0; if (x < 0 || y < 0 || x >= W || y >= H) return null; const o = (y * W + x) * 4; return { k: C[o], bl: C[o + 1], puff: C[o + 2] / 255 }; };
  S.setup(info, W, H);
  const img = ctx.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const o = (y * W + x) * 4, c = S.color({ k: C[o], bl: C[o + 1], puff: C[o + 2] / 255 }, x, y);
    d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
  }
  // outlines (optionally thickened)
  const ink = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) ink[i] = Ln[i * 4] === 255 ? 0 : 1 - Ln[i * 4 + 1] / 255;
  let src = ink;
  for (let it = 0; it < S.lineW; it++) {
    const nx = new Float32Array(W * H);
    for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) { const i = y * W + x; nx[i] = Math.max(src[i], 0.85 * Math.max(src[i - 1], src[i + 1], src[i - W], src[i + W])); }
    src = nx;
  }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
    const i = y * W + x, o = i * 4, v = src[i]; if (v < 0.1) continue;
    let k = Ln[o]; if (k === 255) k = C[o];
    const lc = S.line(k), a = clamp(v * 1.2);
    d[o] = d[o] * (1 - a) + lc[0] * a; d[o + 1] = d[o + 1] * (1 - a) + lc[1] * a; d[o + 2] = d[o + 2] * (1 - a) + lc[2] * a;
  }
  ctx.putImageData(img, 0, 0);
  if (STYLE === 'matisse') {   // dark table edge
    ctx.strokeStyle = 'rgb(22,26,56)'; ctx.lineWidth = 6; ctx.beginPath();
    for (let x = 0; x < W; x += 2) { const p = info(x, meta.table_y); if (p && (p.k === WALL || p.k === TABLE)) { ctx.moveTo(x, meta.table_y); ctx.lineTo(x + 2, meta.table_y); } }
    ctx.stroke();
  }
  ctx.globalAlpha = S.grain;   // paper / canvas grain
  for (let y = 0; y < H; y += 3) { ctx.fillStyle = Math.random() < 0.5 ? '#000' : '#fff'; ctx.fillRect(0, y, W, 1); }
  ctx.globalAlpha = 1;
  window.DONE = true;
})();
</script></body></html>
