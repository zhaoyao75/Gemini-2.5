<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)),L=(a,b,t)=>a+(b-a)*t,sm=t=>t*t*(3-2*t),eo=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>cl((t-a)/(b-a));

function cake(sc,rot){return `<g transform="rotate(${rot||0}) scale(${sc})"><path d="M-55 0 L55 0 L42 -60 L-42 -60 Z" fill="#a9cbea" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M-22 -2 L-17 -58 M0 -2 L0 -58 M22 -2 L17 -58" stroke="${INK}" stroke-width="3" opacity=".5"/>
<ellipse cx="0" cy="-66" rx="58" ry="22" fill="#ffa8cb" stroke="${INK}" stroke-width="6"/><ellipse cx="0" cy="-92" rx="40" ry="20" fill="#ffc2db" stroke="${INK}" stroke-width="6"/><ellipse cx="0" cy="-114" rx="22" ry="14" fill="#ffe0ec" stroke="${INK}" stroke-width="6"/><circle cx="0" cy="-136" r="13" fill="#e5282a" stroke="${INK}" stroke-width="5"/></g>`;}
const heart=(x,y,s,o,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 12 C-30 -8 -14 -28 0 -14 C14 -28 30 -8 0 12Z" fill="${c||'#ff6f9a'}" stroke="${INK}" stroke-width="2.5" opacity="${o}"/>`;
const star=(x,y,s,o,c)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 -30 L7 -7 L30 0 L7 7 L0 30 L-7 7 L-30 0 L-7 -7Z" fill="${c||'#ffe79a'}" stroke="${INK}" stroke-width="2" opacity="${o}"/>`;
function fishSVG(sc,rot){return `<g transform="rotate(${rot}) scale(${sc})"><path d="M-40 0 L-78 -22 Q-68 0 -78 22 Z" fill="#d99a2b" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><ellipse rx="46" ry="27" fill="#f4c452" stroke="${INK}" stroke-width="6"/><path d="M-32 11 Q0 23 36 11" fill="none" stroke="${INK}" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"/><path d="M-6 -20 Q8 0 -6 20" fill="none" stroke="${INK}" stroke-width="4" opacity=".5"/><circle cx="26" cy="-7" r="8.5" fill="#fff3dc" stroke="${INK}" stroke-width="3"/><path d="M22 -11 L30 -3 M30 -11 L22 -3" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/></g>`;}
function realFishSVG(sc,rot){return `<g transform="rotate(${rot}) scale(${sc})"><path d="M-52 0 L-106 -36 Q-92 0 -106 36 Z" fill="#e8822a" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/><path d="M-12 -38 Q10 -68 36 -40 Z" fill="#e8822a" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/><ellipse rx="64" ry="39" fill="#f5a94a" stroke="${INK}" stroke-width="6"/><path d="M-50 14 Q0 42 58 14 Q0 28 -50 14Z" fill="#ffe0a8"/><path d="M-24 -16 q10 9 0 20 M-4 -20 q10 9 0 22 M16 -16 q10 9 0 20" fill="none" stroke="${INK}" stroke-width="3.5" opacity=".35" stroke-linecap="round"/><ellipse cx="-10" cy="-24" rx="24" ry="6" fill="#fff" opacity=".6" transform="rotate(-12)"/><circle cx="40" cy="-8" r="9" fill="#fff" stroke="${INK}" stroke-width="4"/><circle cx="42" cy="-8" r="4.5" fill="${INK}"/><path d="M56 6 Q61 11 54 15" fill="none" stroke="${INK}" stroke-width="3.5" stroke-linecap="round"/></g>`;}
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function scatter(t,a,b,n,seed,Z,camC,cx,cy){let h='';const cols=['#ff6f9a','#ffa8cb','#e5405e','#ff8db6','#f78fb0'];
 for(let i=0;i<n;i++){const r=k=>rnd(seed*13+i*7+k);const ts=a+r(1)*(b-a),dur=1.0+r(2)*1.0;if(t<ts||t>ts+dur)continue;const u=(t-ts)/dur;
  const x=cx+(r(3)-0.5)*380+Math.sin(u*5+r(4)*6)*18,wy=cy-u*(150+r(5)*170)-r(6)*40;
  const sy=(wy-camC[1])*Z+960;const vis=Math.max(0,Math.min(1,(sy-520)/100));
  const al=Math.min(1,u*6)*(1-u*u)*vis*0.95;if(al<=0.01)continue;
  const sc=(0.9+r(7)*1.3)*(0.6+0.4*Math.min(1,u*5));
  h+=`<g transform="translate(${x} ${wy}) rotate(${(r(8)-0.5)*50})">`+heart(0,0,sc*1.6,al,cols[Math.floor(r(9)*cols.length)])+`</g>`;}
 return h;}
function eye(x,y,m,dx,dy){const hl=(a,b,r)=>`<circle cx="${x+a+dx}" cy="${y+b+dy}" r="${r}" fill="#fff"/>`;
 if(m=='n')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="31" ry="39" fill="#2a1530"/>`+hl(-7,-20,9);
 if(m=='w')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="39" ry="50" fill="#2a1530"/>`+hl(-9,-26,12);
 if(m=='dot')return `<ellipse cx="${x}" cy="${y}" rx="40" ry="48" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="${x+dx*.3}" cy="${y+dy*.3}" r="10" fill="#2a1530"/>`;
 if(m=='half')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="33" ry="41" fill="#2a1530"/>`+hl(-7,-12,8)+`<path d="M${x-40} ${y-52} L${x+40} ${y-52} L${x+40} ${y-4} Q${x} ${y-14} ${x-40} ${y-4} Z" fill="#fff3dc"/><path d="M${x-38} ${y-4} Q${x} ${y-14} ${x+38} ${y-4}" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
 if(m=='c')return `<path d="M${x-34} ${y+10} Q${x} ${y-34} ${x+34} ${y+10}" stroke="${INK}" stroke-width="11" fill="none" stroke-linecap="round"/>`;
 if(m=='z')return `<path d="M${x-32} ${y-4} Q${x} ${y+14} ${x+32} ${y-4}" stroke="${INK}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
 if(m=='sp')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="44" ry="54" fill="#2a1530"/>`+hl(-14,-26,16)+hl(14,10,9)+hl(-4,24,5);}
function mouth(m){const st=`fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"`;
 if(m=='n')return `<path d="M577 600 Q580 625 600 622 Q620 620 624 600 Q628 622 650 622 Q672 620 672 600" ${st}/>`;
 if(m=='o')return `<ellipse cx="624" cy="618" rx="15" ry="19" fill="#c0504d" stroke="${INK}" stroke-width="7"/>`;
 if(m=='big')return `<path d="M572 598 Q624 676 676 598 Z" fill="#d9625f" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/><path d="M600 640 Q624 622 648 640 Q624 664 600 640Z" fill="#f59a9a"/>`;
 if(m=='w')return `<path d="M572 614 q13 -16 26 0 t26 0 t26 0 t26 0" ${st}/>`;}
const nose=`<path d="M603 565 L645 565 L624 588 Z" fill="#f28ca8"/>`;
function drawCat(o){
 let pws='';[[478,0],[762,0.5]].forEach(([cx0,off])=>{let u=(((o.phi||0)+off)%1+1)%1,dx,lift=0;
  if(u<0.6)dx=75-150*u/0.6;else{const v=(u-0.6)/0.4;dx=-75+150*v;lift=Math.sin(Math.PI*v)*52;}
  const pw=o.pw||0;dx*=pw;lift*=pw;
  pws+=`<g transform="translate(${cx0+dx} ${988-lift}) rotate(${-lift*0.3})"><ellipse rx="56" ry="30" fill="#fff3dc" stroke="${INK}" stroke-width="12"/><path d="M-14 2 L-16 22 M14 2 L16 22" stroke="${INK}" stroke-width="9" stroke-linecap="round" fill="none"/></g>`;});
 $('paws').innerHTML=pws;
 $('face').innerHTML=eye(517,540,o.eye,o.dx,o.dy)+eye(738,540,o.eye,o.dx,o.dy)+nose+mouth(o.mouth)+
  `<ellipse cx="455" cy="610" rx="38" ry="20" fill="#f58fa8" opacity="${o.blush}"/><ellipse cx="800" cy="610" rx="38" ry="20" fill="#f58fa8" opacity="${o.blush}"/>`;
 $('hat').innerHTML=o.fishMouth?`<g transform="translate(634 640) scale(${1.5*(1+0.25*(o.fishSq||0))} ${1.5*(1-0.32*(o.fishSq||0))})">${fishSVG(1,0)}</g>`:'';
 $('tail').setAttribute('transform',`rotate(${o.tail} 985 850)`);
 $('cat').setAttribute('transform',`translate(${o.x} ${o.y}) rotate(${o.rot}) scale(${S*o.sx} ${S*o.sy}) translate(-620 -1000)`);
 $('sh').setAttribute('cx',o.x);$('sh').setAttribute('cy',o.shy);$('sh').setAttribute('rx',190*o.shs);
}
</script>
<script>
const STY=['vangogh', 'klimt', 'picasso', 'munch', 'lichtenstein'],LAB=['梵高 · 旋转笔触', '克里姆特 · 金箔', '毕加索 · 立体主义', '蒙克 · 呐喊', '利希滕斯坦 · 波普'],LINES=['晕。', '贵。', '脸碎了。', '啊。', '吵。'],N12=['vangogh', 'matisse', 'kandinsky', 'monet', 'magritte', 'mondrian', 'klimt', 'schiele', 'pollock', 'picasso', 'munch', 'lichtenstein'],Z12=['梵高', '马蒂斯', '康定斯基', '莫奈', '马格利特', '蒙德里安', '克里姆特', '席勒', '波洛克', '毕加索', '蒙克', '利希滕斯坦'];
const T_S0=1.6,SD=2.0,T_BOX=T_S0+SD*5,T_END=T_BOX+1.8;   // 1.6, 11.6, 13.4
const ease=t=>1-Math.pow(1-cl(t),3);
['shelf','door','chair','glow','fishW'].forEach(id=>{const e=$(id);if(e)e.setAttribute('display','none');});
const cam=$('cam');
// ---- room: framed painting on the wall (Van Gogh first, Lichtenstein after the cat comes back)
cam.insertAdjacentHTML('beforeend',`<g id="wallart" transform="translate(540 585)"><path d="M-250 -490 L0 -640 L250 -490" fill="none" stroke="#3b2040" stroke-width="4"/><circle cx="0" cy="-640" r="9" fill="#e6c86e" stroke="#3b2040" stroke-width="4"/>
 <rect x="-378" y="-494" width="756" height="989" rx="22" fill="#e6c86e" stroke="#3b2040" stroke-width="8"/><rect x="-360" y="-476" width="720" height="953" rx="10" fill="#fff3dc" stroke="#3b2040" stroke-width="5"/>
 <image id="wa0" href="p/vangogh.jpg" x="-350" y="-466" width="700" height="933"/><image id="wa1" href="p/lichtenstein.jpg" x="-350" y="-466" width="700" height="933" display="none"/></g>
 <g id="boxBack" display="none"><g transform="translate(-70 0)"><path d="M690 1560 L1030 1560 L1056 1480 L720 1480 Z" fill="#b98a55" stroke="#3b2040" stroke-width="7" stroke-linejoin="round"/></g></g>
 <g id="boxFront" display="none"><g transform="translate(-70 0)"><path d="M690 1600 L1030 1600 L1030 1840 L690 1840 Z" fill="#d6a56b" stroke="#3b2040" stroke-width="8" stroke-linejoin="round"/><rect x="822" y="1600" width="76" height="240" fill="#ecc98f" opacity=".8"/><rect x="930" y="1700" width="70" height="46" rx="5" fill="#fff3dc" stroke="#3b2040" stroke-width="4"/><path d="M940 1716 h50 M940 1732 h36" stroke="#3b2040" stroke-width="4"/><path d="M690 1600 L650 1555 L720 1535 L735 1600 Z" fill="#e0b57a" stroke="#3b2040" stroke-width="7" stroke-linejoin="round"/><path d="M1030 1600 L1072 1556 L1004 1535 L988 1600 Z" fill="#e0b57a" stroke="#3b2040" stroke-width="7" stroke-linejoin="round"/></g></g>`);
// ---- stage: the painting "world" (full screen, pink wall bands + painting + stylised cat)
let st='';
for(let i=0;i<5;i++){let cs='';for(let k=1;k<=6;k++)cs+=`<image id="c${i}_${k}" href="styled/${STY[i]}_${k}.png" x="407" y="1095" width="585" height="450" display="none"/>`;
 st+=`<g id="sc${i}" display="none"><g clip-path="url(#pc)"><image href="p2/${STY[i]}.jpg" x="0" y="120" width="1080" height="1440"/><g id="cg${i}">${cs}</g><g id="ex${i}"></g></g><rect x="0" y="120" width="1080" height="1440" fill="none" stroke="#e6c86e" stroke-width="10"/></g>`;}
document.querySelector('svg').insertAdjacentHTML('beforeend',`<defs><clipPath id="pc"><rect x="0" y="120" width="1080" height="1440"/></clipPath></defs>
 <g id="stage" display="none"><rect width="1080" height="1920" fill="url(#wg)"/><g fill="#ffd8ec" id="sdots"></g>${st}<g id="lab"></g><g id="sub2"></g></g>`);
let dd='';for(let y=40;y<1920;y+=120)for(let x=(y/120%2)*60+30;x<1080;x+=120)dd+=`<circle cx="${x}" cy="${y}" r="9"/>`;$('sdots').innerHTML=dd;
// ---- hud: room subtitle + end card
$('hud').innerHTML=`<g id="sub"></g><g id="end" display="none"><rect width="1080" height="1920" fill="#3b2040" opacity=".55"/><g id="endCard"><rect x="90" y="150" width="900" height="1620" rx="46" fill="#fff3dc" stroke="#3b2040" stroke-width="10"/>
 <rect x="300" y="205" width="480" height="76" rx="38" fill="#ffd566" stroke="#3b2040" stroke-width="6"/><text x="540" y="258" text-anchor="middle" font-size="42" fill="#3b2040">团子猫日常 · 特别篇</text>
 <text x="540" y="400" text-anchor="middle" font-size="104" fill="#3b2040">谁是你的最爱?</text><text x="540" y="470" text-anchor="middle" font-size="64">😍</text><g id="grid"></g></g></g>`;
let g='';const GW=224,GH=299,GX=14,GY=14,gx0=540-(3*GW+2*GX)/2,gy0=510;N12.forEach((n,i)=>{const c=i%3,r=(i/3)|0,x=gx0+c*(GW+GX),y=gy0+r*(GH+GY);g+=`<image href="p/${n}.jpg" x="${x}" y="${y}" width="${GW}" height="${GH}"/><rect x="${x}" y="${y}" width="${GW}" height="${GH}" fill="none" stroke="#3b2040" stroke-width="5"/><rect x="${x+8}" y="${y+GH-54}" width="${Z12[i].length*34+26}" height="44" rx="10" fill="#fff3dc" stroke="#3b2040" stroke-width="3"/><text x="${x+21}" y="${y+GH-22}" font-size="32" fill="#3b2040">${Z12[i]}</text>`;});$('grid').innerHTML=g;
const subtxt=(el,txt,u,y,sz)=>{$(el).innerHTML=u>0?`<g transform="translate(540 ${y}) scale(${0.7+0.3*u})"><text text-anchor="middle" font-size="${sz||104}" fill="#fff3dc" stroke="#3b2040" stroke-width="20" stroke-linejoin="round" paint-order="stroke" opacity="${u}">${txt}</text></g>`:'';};
function R(t){
 const o={x:540,y:1740,rot:0,sx:1.4,sy:1.4,shy:1752,shs:1.9,tail:5*Math.sin(t*2.3),eye:'half',mouth:'n',dx:0,dy:-8,blush:.5,phi:0,pw:0};
 o.sy*=1+0.012*Math.sin(t*5);
 const inStage=t>=1.3&&t<T_BOX+0.3;
 // ===== stage
 $('stage').setAttribute('display',inStage?'inline':'none');
 let stageOp=1,stageT='';
 if(t<T_S0){const u=ease((t-1.3)/0.3);stageOp=u;stageT=`translate(540 960) rotate(${(1-u)*-25}) scale(${0.5+0.5*u}) translate(-540 -960)`;}
 else if(t>=T_BOX){const u=ease((t-T_BOX)/0.3);stageOp=1-u;stageT=`translate(540 960) rotate(${u*25}) scale(${1+0.5*u}) translate(-540 -960)`;}
 $('stage').setAttribute('opacity',stageOp);$('stage').setAttribute('transform',stageT);
 if(inStage){
  const k=Math.min(4,Math.max(0,Math.floor((t-T_S0)/SD)));const u=t-T_S0-k*SD;
  for(let i=0;i<5;i++){let x=null;
   if(i==k){x=u<0.2&&k>0?(1-ease(u/0.2))*1080:0;}
   else if(i==k-1&&u<0.2){x=-ease(u/0.2)*1080;}
   const el=$('sc'+i);if(x===null||(t<T_S0&&i>0))el.setAttribute('display','none');else{el.setAttribute('display','inline');el.setAttribute('transform',`translate(${x} 0)`);}
   if(x!==null){const fr=1+(Math.floor(t*8)%6);for(let q=1;q<=6;q++)$(`c${i}_${q}`).setAttribute('display',q==fr?'inline':'none');
    const bob=4*Math.sin(t*4+i),rt=(i==0?7*Math.sin(t*3):i==2?3*Math.sin(t*9):0);
    $('cg'+i).setAttribute('transform',`translate(0 ${bob}) rotate(${rt} 700 1530)`);}}
  // extras per scene
  $('ex1').innerHTML=(k==1&&u>0.5)?`<g transform="translate(895 1150) rotate(12)"><path d="M0 -140 Q-30 -60 0 0" fill="none" stroke="#3b2040" stroke-width="5"/><rect x="-62" y="0" width="124" height="72" rx="8" fill="#ffe08a" stroke="#3b2040" stroke-width="5"/><circle cx="0" cy="12" r="5" fill="#3b2040"/><text x="0" y="56" text-anchor="middle" font-size="36" fill="#b8231f" stroke="#b8231f" stroke-width="1">299元</text></g>`:'';
  $('ex4').innerHTML=(k==4&&u>0.35)?`<g transform="translate(300 1180) rotate(-8)"><path d="M0 -70 L30 -40 L70 -60 L56 -20 L96 0 L52 14 L66 56 L26 36 L0 80 L-24 38 L-64 54 L-50 14 L-96 4 L-52 -22 L-66 -62 L-28 -42 Z" fill="#ffe04a" stroke="#0a0a0a" stroke-width="8" stroke-linejoin="round" transform="scale(${0.6+0.4*ease((u-0.35)/0.15)})"/><text text-anchor="middle" y="14" font-size="46" fill="#e4202a" stroke="#0a0a0a" stroke-width="5" paint-order="stroke">POW!</text></g>`:'';
  // label + subtitle
  $('lab').innerHTML=`<rect x="190" y="30" width="700" height="64" rx="32" fill="#ffd566" stroke="#3b2040" stroke-width="6"/><text x="540" y="76" text-anchor="middle" font-size="38" fill="#3b2040">${LAB[k]}</text>`;
  subtxt('sub2',LINES[k],ease((u-0.3)/0.12),1760,120);
 } else {$('lab').innerHTML='';$('sub2').innerHTML='';}
 // ===== room
 const inBox=t>=T_BOX;

 let catVis=true;
 if(t<T_S0){
   if(t<1.0){o.eye='half';o.mouth='n';subtxt('sub','又是荷花。',ease((t-0.3)/0.12),1165);}
   else{const u=cl((t-1.0)/0.45),e=ease(u);o.x=L(540,540,e);o.y=L(1740,640,e)-190*Math.sin(Math.PI*u);o.sx=o.sy=L(1.4,0.3,e);o.rot=-300*e*0;o.pw=1;o.phi=t*4;o.eye='dot';o.mouth='w';o.shs=1.9*(1-e);}
   if(t>=1.45)catVis=false;
 } else if(t<T_BOX){catVis=false;}
 else{
   const u=t-T_BOX,e0=cl((u-0.15)/0.5),e=e0*e0;      // drops out of the painting into the box
   if(e0<1){o.x=L(540,790,sm(e0));o.y=L(640,1740,e)-120*Math.sin(Math.PI*e0);o.sx=o.sy=L(0.3,1.3,sm(e0));o.eye='dot';o.mouth='o';o.shs=1.9*e0;}
   else{o.x=790;o.y=1758+4*Math.sin(t*6)*Math.max(0,1-(u-0.65)*4);o.sx=o.sy=1.3;o.eye='c';o.mouth='n';o.blush=.95;o.shs=1.9;}
   if(u<0.15)catVis=false;
   subtxt('sub','最爱:纸箱',ease((u-0.95)/0.12),1165);
 }
 $('cat').setAttribute('display',catVis?'inline':'none');$('sh').setAttribute('display',catVis?'inline':'none');
 drawCat(o);
 if(inBox){$('cat').after($('boxFront'));}
 // end card
 if(t>=T_END){const u=ease((t-T_END)/0.2);$('end').setAttribute('display','inline');$('endCard').setAttribute('transform',`translate(540 960) scale(${0.9+0.1*u}) translate(-540 -960)`);$('end').setAttribute('opacity',u);}else $('end').setAttribute('display','none');
}
window.R=R;
</script></body></html>
