<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head><body><canvas id="c"></canvas>
<script>
const Q=new URLSearchParams(location.search),STYLE=Q.get('style'),POSE=Q.get('pose'),SEED=+Q.get('seed')||1;
let s=SEED*7919+13;const rand=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};const R=(a,b)=>a+(b-a)*rand();
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const img=new Image();img.onload=()=>{
 const W=img.width,H=img.height,cv=document.getElementById('c');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
 const t=document.createElement('canvas');t.width=W;t.height=H;const tc=t.getContext('2d');tc.drawImage(img,0,0);const D=tc.getImageData(0,0,W,H).data;
 const at=(x,y)=>{x=cl(x|0,0,W-1);y=cl(y|0,0,H-1);const o=(y*W+x)*4;return [D[o],D[o+1],D[o+2],D[o+3]];};
 const isIn=(x,y)=>at(x,y)[3]>128, lum=p=>0.3*p[0]+0.59*p[1]+0.11*p[2];
 const isInk=(x,y)=>{const p=at(x,y);return p[3]>128&&lum(p)<110;};
 const isPink=(x,y)=>{const p=at(x,y);return p[3]>128&&p[0]>220&&p[1]<190&&p[2]>140&&p[2]<215;};
 // bounding box + centre
 let x0=W,y0=H,x1=0,y1=0;for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2)if(isIn(x,y)){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
 const cx=(x0+x1)/2,cy=(y0+y1)/2;
 const dab=(x,y,len,wid,ang,col,a=1)=>{ctx.fillStyle=css(col,a);ctx.beginPath();ctx.ellipse(x,y,len,wid,ang,0,6.283);ctx.fill();};
 if(STYLE==='vangogh'){
  const pts=[];for(let y=y0-6;y<y1+6;y+=3.6)for(let x=x0-6;x<x1+6;x+=3.6)pts.push([x+R(-3,3),y+R(-3,3)]);
  for(let i=pts.length-1;i>0;i--){const j=(rand()*(i+1))|0;[pts[i],pts[j]]=[pts[j],pts[i]];}
  for(const [x,y] of pts){ if(!isIn(x,y)&&!isIn(x+4,y)&&!isIn(x-4,y)&&!isIn(x,y+4)&&!isIn(x,y-4))continue;
   const p=at(x,y);let c;
   if(isInk(x,y)) c=mix(hex('#14205e'),hex('#2a3a8a'),rand());
   else if(isPink(x,y)) c=mix(hex('#e46a9a'),hex('#f8b0c8'),rand());
   else{const sh=cl((y-cy)/(y1-cy),0,1);c=mix(mix(hex('#fff0c0'),hex('#f8d84a'),rand()*0.55),hex('#6a8ad0'),sh*0.25*rand());}
   const ang=Math.atan2(y-cy,x-cx)+Math.PI/2+R(-0.55,0.55);   // swirl around the cat
   dab(x,y,R(7,12),R(1.8,3),ang,c,R(0.8,1));}
  // swirling halo strokes (the starry-night sky) around the cat
  for(let k=0;k<160;k++){const a=R(0,6.28),r=R(0.62,0.78)*Math.max(x1-x0,y1-y0)/1.5;const x=cx+Math.cos(a)*r*1.1,y=cy+Math.sin(a)*r*0.9;
   if(isIn(x,y))continue;dab(x,y,R(8,15),R(2,3.2),a+Math.PI/2+R(-.3,.3),mix(hex('#2b4fb8'),hex('#f4d03f'),rand()),0.55);}
 }
 if(STYLE==='klimt'){
  const gold=['#c8951f','#e0b43c','#f2d06a','#b9801a','#e8c24e','#fbe38a'].map(hex);
  const face=(x,y)=>((x-cx)/(0.34*(x1-x0)))**2+((y-(y0+0.42*(y1-y0)))/(0.20*(y1-y0)))**2<1;
  // gold-leaf squares for the body
  const SQ=11;for(let y=y0-4;y<y1+4;y+=SQ)for(let x=x0-4;x<x1+4;x+=SQ){ if(!isIn(x+SQ/2,y+SQ/2))continue;
    if(face(x+SQ/2,y+SQ/2)||isPink(x+SQ/2,y+SQ/2)) {const p=at(x+SQ/2,y+SQ/2);ctx.fillStyle=css(p.slice(0,3));ctx.fillRect(x,y,SQ,SQ);continue;}
    const c=mix(gold[(rand()*gold.length)|0],[255,240,170],R(0,0.25));ctx.fillStyle=css(c);ctx.fillRect(x,y,SQ-1,SQ-1);}
  // Klimt dress motifs: spirals, eyes, black/white rectangles
  ctx.save();ctx.beginPath();for(let y=y0;y<y1;y+=3)for(let x=x0;x<x1;x+=3)if(isIn(x,y)&&!face(x,y)&&!isPink(x,y))ctx.rect(x,y,3.2,3.2);ctx.clip();
  const yb=y0+0.5*(y1-y0);
  for(let k=0;k<26;k++){const x=R(x0,x1),y=R(yb,y1);const r=R(14,26);const kind=k%3;
   if(kind==0){ctx.strokeStyle='#4a2a08';ctx.lineWidth=2.6;ctx.beginPath();for(let a=0;a<14;a+=0.3){const rr=r*a/14;ctx.lineTo(x+Math.cos(a*1.1)*rr,y+Math.sin(a*1.1)*rr);}ctx.stroke();}
   else if(kind==1){ctx.fillStyle='#fff3dc';ctx.beginPath();ctx.ellipse(x,y,r*0.9,r*0.55,0,0,6.28);ctx.fill();ctx.fillStyle='#1a1008';ctx.beginPath();ctx.arc(x,y,r*0.32,0,6.28);ctx.fill();ctx.strokeStyle='#4a2a08';ctx.lineWidth=2.4;ctx.beginPath();ctx.ellipse(x,y,r*0.9,r*0.55,0,0,6.28);ctx.stroke();}
   else{ctx.fillStyle=k%2?'#1a1008':'#fff3dc';ctx.fillRect(x-r*0.5,y-r*0.9,r,r*1.8);ctx.strokeStyle='#8a5a12';ctx.lineWidth=2;ctx.strokeRect(x-r*0.5,y-r*0.9,r,r*1.8);}}
  ctx.restore();
  // face features and outline from the sprite: ink pixels in brown-black
  for(let y=y0;y<y1;y+=1)for(let x=x0;x<x1;x+=1){if(isInk(x,y)){const o=face(x,y)?'#2a1030':'#5a3a0a';ctx.fillStyle=o;ctx.fillRect(x,y,1.6,1.6);}}
 }
 if(STYLE==='picasso'){
  const N=26,seeds=[];for(let i=0;i<N;i++)seeds.push({x:R(x0,x1),y:R(y0,y1),dx:R(-16,16),dy:R(-14,14),rot:R(-0.16,0.16),tone:R(0.78,1.14),hue:rand()});
  const out=ctx.createImageData(W,H),O=out.data;const cell=new Int16Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){let b=0,bd=1e9;for(let i=0;i<N;i++){const d=(x-seeds[i].x)**2+(y-seeds[i].y)**2;if(d<bd){bd=d;b=i;}}cell[y*W+x]=b;}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=seeds[cell[y*W+x]];const ca=Math.cos(-c.rot),sa=Math.sin(-c.rot);
   const ux=x-c.dx-c.x,uy=y-c.dy-c.y;const sx=c.x+ux*ca-uy*sa,sy=c.y+ux*sa+uy*ca;const p=at(sx,sy);const o=(y*W+x)*4;
   if(p[3]<128)continue;let col=p.slice(0,3);
   if(lum(p)>150){col=mix(col,c.hue<0.33?[232,196,150]:c.hue<0.66?[168,184,200]:[214,160,150],0.45);col=col.map(v=>v*c.tone);}
   O[o]=col[0];O[o+1]=col[1];O[o+2]=col[2];O[o+3]=255;
   const e=(dx,dy)=>cell[cl(y+dy,0,H-1)*W+cl(x+dx,0,W-1)]!==cell[y*W+x];
   if(e(2,0)||e(0,2)||e(-2,0)||e(0,-2)){O[o]=34;O[o+1]=22;O[o+2]=26;}}
  ctx.putImageData(out,0,0);
 }
 if(STYLE==='munch'){
  const out=ctx.createImageData(W,H),O=out.data;const ph=R(0,6.28);
  for(let y=0;y<H;y++){const amp=10+14*(y/H);const shift=amp*Math.sin(y*0.045+ph)+6*Math.sin(y*0.11+ph*2);
   for(let x=0;x<W;x++){const p=at(x-shift,y);if(p[3]<128)continue;const o=(y*W+x)*4;let c=p.slice(0,3);const v=y/H;
    if(p[0]>180&&p[1]<130&&p[2]<150){c=[44,16,44];}
    else if(lum(p)>110&&!(p[0]>220&&p[1]<190)){c=mix(hex('#ffe3a8'),hex('#e8742a'),cl(0.15+v*0.65+0.15*Math.sin(x*0.05+y*0.09+ph)));}
    else if(lum(p)<=110){c=mix(hex('#1a2a6a'),hex('#2a1030'),0.4);}
    O[o]=c[0];O[o+1]=c[1];O[o+2]=c[2];O[o+3]=255;}}
  ctx.putImageData(out,0,0);
  // wavy outline strokes
  for(let k=0;k<260;k++){const a=R(0,6.28);const r=R(0.46,0.5)*(x1-x0);const x=cx+Math.cos(a)*r*1.08,y=cy+Math.sin(a)*r*0.95;if(!isIn(x,y))continue;dab(x,y,R(5,9),R(1.4,2.4),a+Math.PI/2,hex('#14205e'),0.35);}
 }
 if(STYLE==='lichtenstein'){
  const dot=(x,y,sp,rad)=>{const r=Math.floor(y/sp),off=r%2?sp/2:0,c=Math.floor((x+off)/sp);const px=(c+0.5)*sp-off,py=(r+0.5)*sp;return Math.hypot(x-px,y-py)<rad;};
  const out=ctx.createImageData(W,H),O=out.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=at(x,y);if(p[3]<128)continue;const o=(y*W+x)*4;let c;
   if(isInk(x,y))c=[10,10,10];
   else if(isPink(x,y))c=dot(x,y,9,3.6)?[228,32,42]:[255,246,236];
   else if(p[0]>240&&p[1]>170&&p[1]<215&&p[2]>170)c=dot(x,y,9,3.2)?[228,32,42]:[255,246,236];   // blush
   else{const v=(y-y0)/(y1-y0);c=dot(x,y,11,2.6+3.2*v)?[40,90,200]:[255,236,150];}
   O[o]=c[0];O[o+1]=c[1];O[o+2]=c[2];O[o+3]=255;}
  ctx.putImageData(out,0,0);
  // thicker black outline
  const o2=ctx.getImageData(0,0,W,H);ctx.globalCompositeOperation='destination-over';ctx.fillStyle='#0a0a0a';
  for(let y=y0-8;y<y1+8;y+=2)for(let x=x0-8;x<x1+8;x+=2){if(isIn(x,y))continue;let n=false;for(let k=0;k<8&&!n;k++){const a=k*0.785;if(isIn(x+Math.cos(a)*7,y+Math.sin(a)*7))n=true;}if(n)ctx.fillRect(x-1.5,y-1.5,4,4);}
  ctx.globalCompositeOperation='source-over';
 }
 window.DONE=true;};
img.src=`sprites/${POSE}.png`;
</script></body></html>
