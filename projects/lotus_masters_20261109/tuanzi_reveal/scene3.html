<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x)),L=(a,b,t)=>a+(b-a)*t,sm=t=>t*t*(3-2*t),eo=t=>1-Math.pow(1-t,3);
const seg=(t,a,b)=>cl((t-a)/(b-a));

<ellipse cx="0" cy="-66" rx="58" ry="22" fill="#ffa8cb" stroke="${INK}" stroke-width="6"/><ellipse cx="0" cy="-92" rx="40" ry="20" fill="#ffc2db" stroke="${INK}" stroke-width="6"/><ellipse cx="0" cy="-114" rx="22" ry="14" fill="#ffe0ec" stroke="${INK}" stroke-width="6"/><circle cx="0" cy="-136" r="13" fill="#e5282a" stroke="${INK}" stroke-width="5"/></g>`;}

function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function scatter(t,a,b,n,seed,Z,camC,cx,cy){let h='';const cols=['#ff6f9a','#ffa8cb','#e5405e','#ff8db6','#f78fb0'];
 for(let i=0;i<n;i++){const r=k=>rnd(seed*13+i*7+k);const ts=a+r(1)*(b-a),dur=1.0+r(2)*1.0;if(t<ts||t>ts+dur)continue;const u=(t-ts)/dur;
  const x=cx+(r(3)-0.5)*380+Math.sin(u*5+r(4)*6)*18,wy=cy-u*(150+r(5)*170)-r(6)*40;
  const sy=(wy-camC[1])*Z+960;const vis=Math.max(0,Math.min(1,(sy-520)/100));
  const al=Math.min(1,u*6)*(1-u*u)*vis*0.95;if(al<=0.01)continue;
  const sc=(0.9+r(7)*1.3)*(0.6+0.4*Math.min(1,u*5));
  h+=`<g transform="translate(${x} ${wy}) rotate(${(r(8)-0.5)*50})">`+heart(0,0,sc*1.6,al,cols[Math.floor(r(9)*cols.length)])+`</g>`;}
 return h;}
function eye(x,y,m,dx,dy){const hl=(a,b,r)=>`<circle cx="${x+a+dx}" cy="${y+b+dy}" r="${r}" fill="#fff"/>`;
 if(m=='n')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="31" ry="39" fill="#2a1530"/>`+hl(-7,-20,9);
 if(m=='w')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="39" ry="50" fill="#2a1530"/>`+hl(-9,-26,12);
 if(m=='dot')return `<ellipse cx="${x}" cy="${y}" rx="40" ry="48" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="${x+dx*.3}" cy="${y+dy*.3}" r="10" fill="#2a1530"/>`;
 if(m=='half')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="33" ry="41" fill="#2a1530"/>`+hl(-7,-12,8)+`<path d="M${x-40} ${y-52} L${x+40} ${y-52} L${x+40} ${y-4} Q${x} ${y-14} ${x-40} ${y-4} Z" fill="#fff3dc"/><path d="M${x-38} ${y-4} Q${x} ${y-14} ${x+38} ${y-4}" stroke="${INK}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
 if(m=='c')return `<path d="M${x-34} ${y+10} Q${x} ${y-34} ${x+34} ${y+10}" stroke="${INK}" stroke-width="11" fill="none" stroke-linecap="round"/>`;
 if(m=='z')return `<path d="M${x-32} ${y-4} Q${x} ${y+14} ${x+32} ${y-4}" stroke="${INK}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
 if(m=='sp')return `<ellipse cx="${x+dx}" cy="${y+dy}" rx="44" ry="54" fill="#2a1530"/>`+hl(-14,-26,16)+hl(14,10,9)+hl(-4,24,5);}
function mouth(m){const st=`fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round"`;
 if(m=='n')return `<path d="M577 600 Q580 625 600 622 Q620 620 624 600 Q628 622 650 622 Q672 620 672 600" ${st}/>`;
 if(m=='o')return `<ellipse cx="624" cy="618" rx="15" ry="19" fill="#c0504d" stroke="${INK}" stroke-width="7"/>`;
 if(m=='big')return `<path d="M572 598 Q624 676 676 598 Z" fill="#d9625f" stroke="${INK}" stroke-width="9" stroke-linejoin="round"/><path d="M600 640 Q624 622 648 640 Q624 664 600 640Z" fill="#f59a9a"/>`;
 if(m=='w')return `<path d="M572 614 q13 -16 26 0 t26 0 t26 0 t26 0" ${st}/>`;}
const nose=`<path d="M603 565 L645 565 L624 588 Z" fill="#f28ca8"/>`;
function drawCat(o){
 let pws='';[[478,0],[762,0.5]].forEach(([cx0,off])=>{let u=(((o.phi||0)+off)%1+1)%1,dx,lift=0;
  if(u<0.6)dx=75-150*u/0.6;else{const v=(u-0.6)/0.4;dx=-75+150*v;lift=Math.sin(Math.PI*v)*52;}
  const pw=o.pw||0;dx*=pw;lift*=pw;
  pws+=`<g transform="translate(${cx0+dx} ${988-lift}) rotate(${-lift*0.3})"><ellipse rx="56" ry="30" fill="#fff3dc" stroke="${INK}" stroke-width="12"/><path d="M-14 2 L-16 22 M14 2 L16 22" stroke="${INK}" stroke-width="9" stroke-linecap="round" fill="none"/></g>`;});
 $('paws').innerHTML=pws;
 $('face').innerHTML=eye(517,540,o.eye,o.dx,o.dy)+eye(738,540,o.eye,o.dx,o.dy)+nose+mouth(o.mouth)+
  `<ellipse cx="455" cy="610" rx="38" ry="20" fill="#f58fa8" opacity="${o.blush}"/><ellipse cx="800" cy="610" rx="38" ry="20" fill="#f58fa8" opacity="${o.blush}"/>`;
 $('hat').innerHTML=o.fishMouth?`<g transform="translate(634 640) scale(${1.5*(1+0.25*(o.fishSq||0))} ${1.5*(1-0.32*(o.fishSq||0))})">${fishSVG(1,0)}</g>`:'';
 $('tail').setAttribute('transform',`rotate(${o.tail} 985 850)`);
 $('cat').setAttribute('transform',`translate(${o.x} ${o.y}) rotate(${o.rot}) scale(${S*o.sx} ${S*o.sy}) translate(-620 -1000)`);
 $('sh').setAttribute('cx',o.x);$('sh').setAttribute('cy',o.shy);$('sh').setAttribute('rx',190*o.shs);
}

<script>
const PA=['mondrian','vangogh','picasso','munch','lichtenstein'];
const LABELS=['蒙德里安 · 红黄蓝','梵高 · 旋转笔触','毕加索 · 立体主义','蒙克 · 呐喊','利希滕斯坦 · 波普'];
const SUBC=['还是荷花。','也是荷花。','全是荷花。','都是荷花。'];
const N12=['vangogh','matisse','kandinsky','monet','magritte','mondrian','klimt','schiele','pollock','picasso','munch','lichtenstein'];
const Z12=['梵高','马蒂斯','康定斯基','莫奈','马格利特','蒙德里安','克里姆特','席勒','波洛克','毕加索','蒙克','利希滕斯坦'];
const T_B=1.2,T_WIPE=0.8,T_C=3.2,CD=1.2,T_BOX=T_C+CD*4,T_END=T_BOX+2.0;     // 3.2, 8.0, 9.4
const ease=t=>1-Math.pow(1-cl(t),3);
['shelf','door','chair','glow','fishW'].forEach(id=>{const e=$(id);if(e)e.setAttribute('display','none');});
const cam=$('cam');
// stage lives inside the cam group, below the cat, so the cat can stand in the corner above it
const st=document.createElementNS('http://www.w3.org/2000/svg','g');st.id='stage';
let sg='<defs><clipPath id="pc"><rect x="0" y="120" width="1080" height="1440"/></clipPath>';
for(let i=0;i<5;i++)sg+=`<clipPath id="ov${i}"><rect id="ovr${i}" x="0" y="120" width="1080" height="0"/></clipPath>`;sg+='</defs>';
sg+='<rect x="-100" y="-100" width="1280" height="2120" fill="url(#wg)"/><g fill="#ffd8ec" id="sdots"></g>';
for(let i=0;i<5;i++)sg+=`<g id="sc${i}" display="none"><g clip-path="url(#pc)"><image href="p2/${PA[i]}.jpg" x="0" y="120" width="1080" height="1440"/><g clip-path="url(#ov${i})" id="ovg${i}"><image href="halo.png" x="0" y="120" width="1080" height="1440"/><image href="lines.png" x="0" y="120" width="1080" height="1440"/></g></g><rect x="0" y="120" width="1080" height="1440" fill="none" stroke="#e6c86e" stroke-width="10"/></g>`;
sg+='<g id="scan" display="none"><rect x="0" y="-5" width="1080" height="10" fill="#fff6a8"/><rect x="0" y="-26" width="1080" height="52" fill="#ffe04a" opacity=".35"/></g><rect id="flash" x="0" y="120" width="1080" height="1440" fill="#fff" opacity="0"/><g id="lab"></g><g id="sub2"></g>';
st.innerHTML=sg;cam.insertBefore(st,$('sh'));
let dd='';for(let y=40;y<1920;y+=120)for(let x=(y/120%2)*60+30;x<1080;x+=120)dd+=`<circle cx="${x}" cy="${y}" r="9"/>`;$('sdots').innerHTML=dd;
cam.insertAdjacentHTML('beforeend',`<g id="wallart" transform="translate(540 585)"><path d="M-250 -490 L0 -640 L250 -490" fill="none" stroke="#3b2040" stroke-width="4"/><circle cx="0" cy="-640" r="9" fill="#e6c86e" stroke="#3b2040" stroke-width="4"/>
 <rect x="-378" y="-494" width="756" height="989" rx="22" fill="#e6c86e" stroke="#3b2040" stroke-width="8"/><rect x="-360" y="-476" width="720" height="953" rx="10" fill="#fff3dc" stroke="#3b2040" stroke-width="5"/><image href="p/lichtenstein.jpg" x="-350" y="-466" width="700" height="933"/></g>
 <g id="boxBack" display="none"><g transform="translate(-70 0)"><path d="M690 1560 L1030 1560 L1056 1480 L720 1480 Z" fill="#b98a55" stroke="#3b2040" stroke-width="7" stroke-linejoin="round"/><path d="M690 1590 L650 1555 L720 1535 L735 1590 Z" fill="#e0b57a" stroke="#3b2040" stroke-width="7" stroke-linejoin="round"/><path d="M1030 1590 L1072 1556 L1004 1535 L988 1590 Z" fill="#e0b57a" stroke="#3b2040" stroke-width="7" stroke-linejoin="round"/></g></g>
 <g id="boxFront" display="none"><g transform="translate(-70 0)"><path d="M690 1600 L1030 1600 L1030 1840 L690 1840 Z" fill="#d6a56b" stroke="#3b2040" stroke-width="8" stroke-linejoin="round"/><rect x="822" y="1600" width="76" height="240" fill="#ecc98f" opacity=".8"/><rect x="930" y="1700" width="70" height="46" rx="5" fill="#fff3dc" stroke="#3b2040" stroke-width="4"/><path d="M940 1716 h50 M940 1732 h36" stroke="#3b2040" stroke-width="4"/></g></g>`);
cam.insertBefore($('boxBack'),$('sh'));
$('hud').innerHTML=`<g id="sub"></g><g id="end" display="none"><rect width="1080" height="1920" fill="#3b2040" opacity=".55"/><g id="endCard"><rect x="90" y="150" width="900" height="1620" rx="46" fill="#fff3dc" stroke="#3b2040" stroke-width="10"/>
 <rect x="300" y="205" width="480" height="76" rx="38" fill="#ffd566" stroke="#3b2040" stroke-width="6"/><text x="540" y="258" text-anchor="middle" font-size="42" fill="#3b2040">团子猫日常 · 特别篇</text>
 <text x="540" y="372" text-anchor="middle" font-size="66" fill="#b8231f">看不懂?其实都是荷花</text>
 <text x="540" y="470" text-anchor="middle" font-size="92" fill="#3b2040">谁是你的最爱?😍</text><g id="grid"></g></g></g>`;
let g='';const GW=224,GH=299,GX=14,GY=14,gx0=540-(3*GW+2*GX)/2,gy0=510;N12.forEach((n,i)=>{const c=i%3,r=(i/3)|0,x=gx0+c*(GW+GX),y=gy0+r*(GH+GY);g+=`<image href="p/${n}.jpg" x="${x}" y="${y}" width="${GW}" height="${GH}"/><rect x="${x}" y="${y}" width="${GW}" height="${GH}" fill="none" stroke="#3b2040" stroke-width="5"/><rect x="${x+8}" y="${y+GH-54}" width="${Z12[i].length*34+26}" height="44" rx="10" fill="#fff3dc" stroke="#3b2040" stroke-width="3"/><text x="${x+21}" y="${y+GH-22}" font-size="32" fill="#3b2040">${Z12[i]}</text>`;});$('grid').innerHTML=g;
$('hud').appendChild($('sub2'));
const subtxt=(el,txt,u,x,y,sz,fill)=>{$(el).innerHTML=u>0?`<g transform="translate(${x} ${y}) scale(${0.7+0.3*u})"><text text-anchor="middle" font-size="${sz||104}" fill="${fill||'#fff3dc'}" stroke="#3b2040" stroke-width="20" stroke-linejoin="round" paint-order="stroke" opacity="${u}">${txt}</text></g>`:'';};
function R(t){
 const o={x:210,y:1885,rot:0,sx:1.5,sy:1.5,shy:3000,shs:0,tail:5*Math.sin(t*2.3),eye:'half',mouth:'n',dx:0,dy:-8,blush:.5,phi:0,pw:0};
 o.sy*=1+0.012*Math.sin(t*5);
 const inStage=t<T_BOX;
 $('stage').setAttribute('display',inStage?'inline':'none');$('wallart').setAttribute('display',inStage?'none':'inline');
 let k=-1;
 if(t<T_C)k=0;else k=1+Math.min(3,Math.floor((t-T_C)/CD));
 const uC=t-T_C-(k-1)*CD;
 for(let i=0;i<5;i++){let x=null;
   if(i==k){x=(k>=1&&uC<0.15)?(1-ease(uC/0.15))*1080:0;}
   else if(i==k-1&&k>=2&&uC<0.15){x=-ease(uC/0.15)*1080;}
   const el=$('sc'+i);if(x===null)el.setAttribute('display','none');else{el.setAttribute('display','inline');el.setAttribute('transform',`translate(${x} 0)`);}}
 // lineart reveal
 let wipe=0,ovOp=1;
 if(k==0){wipe=ease((t-T_B)/T_WIPE);}
 else{wipe=0;}
 for(let i=0;i<5;i++){$('ovr'+i).setAttribute('height',i==k?1440*wipe:0);$('ovg'+i).setAttribute('opacity',i==k?ovOp:0);}
 const scan=(k==0&&t>=T_B&&wipe<1);$('scan').setAttribute('display',scan?'inline':'none');if(scan)$('scan').setAttribute('transform',`translate(0 ${120+1440*wipe})`);
 // flash + shake at the "aha" moment
 const tf=t-(T_B+T_WIPE);$('flash').setAttribute('opacity',(k==0&&tf>0&&tf<0.3)?0.75*(1-tf/0.3):0);
 if(k==0&&tf>0&&tf<0.4){const a=6*(1-tf/0.4);$('sc0').setAttribute('transform',`translate(${a*Math.sin(tf*90)} ${a*Math.cos(tf*70)})`);}
 // labels and subtitles
 if(inStage){
  $('lab').innerHTML=`<rect x="190" y="30" width="700" height="64" rx="32" fill="#ffd566" stroke="#3b2040" stroke-width="6"/><text x="540" y="76" text-anchor="middle" font-size="38" fill="#3b2040">${LABELS[k]}</text>`;
  if(t<T_B)subtxt('sub2','看不懂。',ease((t-0.12)/0.1),810,1740,84);
  else if(t<T_C){ if(t<T_B+T_WIPE+0.05)$('sub2').innerHTML='';else subtxt('sub2','……是荷花?',ease((t-T_B-T_WIPE-0.05)/0.1),810,1740,84,'#ffe04a');}
  else subtxt('sub2',SUBC[k-1],ease((uC-0.12)/0.1),810,1740,84);
  // cat reactions
  o.sx=o.sy=1.5;
  if(t<T_B){o.eye='half';o.mouth='n';o.rot=-2+1.5*Math.sin(t*3);}
  else if(t<T_C){if(t>=T_B+T_WIPE){const a=t-T_B-T_WIPE;o.eye='dot';o.mouth='o';o.dy=-4;o.y-=a<0.45?150*Math.sin(Math.PI*a/0.45):0;o.sy*=a<0.45?1+0.1*Math.sin(Math.PI*a/0.45):1;}else{o.eye='half';o.mouth='n';o.rot=-3;}}
  else{const j=(t-T_C)%CD;o.eye=j<0.5?'half':'z';o.mouth='n';o.y-=j<0.2?30*Math.sin(Math.PI*j/0.2):0;}
 } else {$('lab').innerHTML='';$('sub2').innerHTML='';}
 // ===== room box scene
 const inBox=t>=T_BOX;
 $('boxBack').setAttribute('display',inBox?'inline':'none');$('boxFront').setAttribute('display',inBox?'inline':'none');
 $('sub').innerHTML='';
 if(inBox){
   const u=t-T_BOX;o.shy=1752;o.shs=1.9;
   if(u<0.75){const w=u/0.75;o.x=L(240,540,sm(w));o.y=1752;o.sx=o.sy=1.35;o.pw=1;o.phi=t*2.6;o.eye='half';o.mouth='n';o.dy=-8;}
   else if(u<1.15){const j=(u-0.75)/0.4;o.x=L(540,790,sm(j));o.y=L(1752,1610,j*j)-210*Math.sin(Math.PI*j);o.sx=o.sy=L(1.35,0.8,sm(j));o.eye='dot';o.mouth='o';o.pw=0;o.shs=1.9*(1-0.8*j);}
   else{const v=u-1.15;o.x=790;o.y=1610+(v<0.3?-22*Math.sin(Math.PI*v/0.3):0);o.sx=0.8;o.sy=0.8*(v<0.3?1+0.1*Math.sin(Math.PI*v/0.3):1);o.eye='c';o.mouth='n';o.blush=.95;o.shs=0;o.shy=3000;}
   subtxt('sub','最爱:纸箱',ease((u-1.3)/0.1),540,1165);
 }
 drawCat(o);
 if(inBox){$('cat').after($('boxFront'));}
 if(t>=T_END){const u=ease((t-T_END)/0.2);$('end').setAttribute('display','inline');$('endCard').setAttribute('transform',`translate(540 960) scale(${0.9+0.1*u}) translate(-540 -960)`);$('end').setAttribute('opacity',u);}else $('end').setAttribute('display','none');
}
window.R=R;
</script></body></html>
