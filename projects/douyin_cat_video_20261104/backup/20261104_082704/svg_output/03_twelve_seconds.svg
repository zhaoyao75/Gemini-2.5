<g id="stage-钩子" data-pptx-bounds="72 330 268 230">
<rect x="72" y="330" width="268" height="4" fill="#FF5A1F" />
<text x="72" y="364" font-size="16" fill="#5A6270">0–3秒</text>
<text x="72" y="400" font-size="26" font-weight="bold" fill="#0B1F3A">钩子</text>
<text x="72" y="440" font-size="22" fill="#14181F">用最抢眼的画面开场：<tspan x="72" dy="34">夸张的表情、意外的</tspan><tspan x="72" dy="34">动作，或一个悬念。</tspan></text>
</g>
<g id="stage-冲突" data-pptx-bounds="361 330 268 230">
<rect x="361" y="330" width="268" height="4" fill="#0B1F3A" />
<text x="361" y="364" font-size="16" fill="#5A6270">3–8秒</text>
<text x="361" y="400" font-size="26" font-weight="bold" fill="#0B1F3A">冲突</text>
<text x="361" y="440" font-size="22" fill="#14181F">让猫遇到一个小麻烦，<tspan x="361" dy="34">用动作和表情推进，</tspan><tspan x="361" dy="34">不靠台词来解释。</tspan></text>
</g>
<g id="stage-反转" data-pptx-bounds="651 330 268 230">
<rect x="651" y="330" width="268" height="4" fill="#0B1F3A" />
<text x="651" y="364" font-size="16" fill="#5A6270">8–11秒</text>
<text x="651" y="400" font-size="26" font-weight="bold" fill="#0B1F3A">反转</text>
<text x="651" y="440" font-size="22" fill="#14181F">给一个出人意料，<tspan x="651" dy="34">但又合乎人设的结果，</tspan><tspan x="651" dy="34">这是转发的理由。</tspan></text>
</g>
<g id="stage-收束" data-pptx-bounds="940 330 268 230">
<rect x="940" y="330" width="268" height="4" fill="#0B1F3A" />
<text x="940" y="364" font-size="16" fill="#5A6270">11–12秒</text>
<text x="940" y="400" font-size="26" font-weight="bold" fill="#0B1F3A">收束</text>
<text x="940" y="440" font-size="22" fill="#14181F">停在一个可回看的<tspan x="940" dy="34">画面，留一句话引发</tspan><tspan x="940" dy="34">评论，也便于循环。</tspan></text>
</g>
