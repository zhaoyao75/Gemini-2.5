<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="zh-CN" data-pptx-page-role="content" font-family="Arial, Microsoft YaHei">
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF" />
<g id="header" data-pptx-bounds="72 60 1136 100">
<text x="72" y="100" font-size="36" font-weight="bold" fill="#0B1F3A">做好宠物猫动画短视频，关键是三件事：钩子、人设、验证</text>
<text x="72" y="148" font-size="26" fill="#14181F">12秒的体量决定每一秒都要有任务：先留人，再动情，最后用数据校准。</text>
</g>
<g id="col-header" data-pptx-bounds="72 196 1136 36">
<line x1="72" y1="196" x2="1208" y2="196" stroke="#0B1F3A" stroke-width="2" />
<text x="72" y="222" font-size="16" font-weight="bold" fill="#5A6270">要点（本报告整理）</text>
<text x="920" y="222" font-size="16" font-weight="bold" fill="#5A6270">依据（行业资料）</text>
</g>
<g id="row-1" data-pptx-bounds="72 232 1136 138">
<line x1="72" y1="232" x2="1208" y2="232" stroke="#D5D8DD" stroke-width="1" />
<rect x="900" y="233" width="308" height="137" fill="#F3F2EE" />
<text x="72" y="320" font-size="72" font-weight="bold" font-family="Arial" fill="#FF5A1F">1</text>
<text x="160" y="276" font-size="26" font-weight="bold" fill="#0B1F3A">钩子：前3秒就要给出看点</text>
<text x="160" y="316" font-size="22" fill="#14181F">开头决定观众去留，先把看点放在最前面。<tspan x="160" dy="34">在后台看3秒完播率，流失高就先改开头。</tspan></text>
<text x="920" y="276" font-size="16" fill="#14181F">行业经验：前3秒流失<tspan x="920" dy="26">超过60%，应优先重做</tspan><tspan x="920" dy="26">开头（非官方说法）</tspan></text>
</g>
<g id="row-2" data-pptx-bounds="72 370 1136 138">
<line x1="72" y1="370" x2="1208" y2="370" stroke="#D5D8DD" stroke-width="1" />
<rect x="900" y="371" width="308" height="137" fill="#F3F2EE" />
<text x="72" y="458" font-size="72" font-weight="bold" font-family="Arial" fill="#FF5A1F">2</text>
<text x="160" y="414" font-size="26" font-weight="bold" fill="#0B1F3A">人设：用一个鲜明性格撑起角色</text>
<text x="160" y="454" font-size="22" fill="#14181F">按猫自身的性格和外形来定人设，<tspan x="160" dy="34">把职场、生活里的小烦恼演成轻松的小剧情。</tspan></text>
<text x="920" y="414" font-size="16" fill="#14181F">例：大橘适配“奋斗者”；<tspan x="920" dy="26">情绪价值是拟人宠物</tspan><tspan x="920" dy="26">短剧的共同点</tspan></text>
</g>
<g id="row-3" data-pptx-bounds="72 508 1136 138">
<line x1="72" y1="508" x2="1208" y2="508" stroke="#D5D8DD" stroke-width="1" />
<rect x="900" y="509" width="308" height="137" fill="#F3F2EE" />
<text x="72" y="596" font-size="72" font-weight="bold" font-family="Arial" fill="#FF5A1F">3</text>
<text x="160" y="552" font-size="26" font-weight="bold" fill="#0B1F3A">验证：小批量发布，用数据决定放大</text>
<text x="160" y="592" font-size="22" fill="#14181F">新视频先进小流量池，数据达标才会被放量；<tspan x="160" dy="34">12秒利于完播，但互动数据同样要看。</tspan></text>
<text x="920" y="552" font-size="16" fill="#14181F">完播率=观看时长÷视频<tspan x="920" dy="26">时长，视频越短越易</tspan><tspan x="920" dy="26">拉高（依据定义的推论）</tspan></text>
</g>
<g id="footer" data-pptx-bounds="72 672 1136 28" fill="#5A6270" font-size="14">
<text x="72" y="686">资料：Kawo、神笔 AI、卡思数据、人人都是产品经理等公开文章整理，均非抖音官方数据；三要点框架为本报告整理。</text>
<text x="1208" y="686" text-anchor="end">02</text>
</g>
