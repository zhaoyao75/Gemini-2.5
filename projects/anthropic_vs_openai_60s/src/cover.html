<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1440"></canvas>
<script>
// Covers: 3:4 (1080x1440) and 4:3 (#43, 1440x1080). Black ground, white + yellow heavy title, a pill subtitle,

const WIDE = location.hash === '#43';
const W = WIDE ? 1440 : 1080, H = WIDE ? 1080 : 1440, cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d'), SANS = '"Noto Sans SC"';

const GOLDC = [232, 207, 148];
function bell(x, y, sc) {                     // (x, y) = hanging point; same golden bell as in the video

  ctx.shadowColor = 'rgba(232,207,148,0.7)'; ctx.shadowBlur = 70;
  ctx.strokeStyle = '#8a6a32'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, -34, 16, 0, 6.283); ctx.stroke();

  ctx.beginPath(); ctx.moveTo(-36, 10); ctx.bezierCurveTo(-36, -22, 36, -22, 36, 10); ctx.bezierCurveTo(40, 100, 70, 140, 126, 176); ctx.lineTo(126, 200); ctx.lineTo(-126, 200); ctx.lineTo(-126, 176); ctx.bezierCurveTo(-70, 140, -40, 100, -36, 10); ctx.closePath(); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.beginPath(); ctx.ellipse(-62, 96, 12, 46, 0.25, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#E8CF94'; ctx.beginPath(); ctx.arc(0, 240, 21, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#2a2118'; ctx.lineWidth = 7; ctx.lineCap = 'round';

  ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 142, 20, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  ctx.restore();
}
function orbC(x, gy, sc) {
  ctx.save(); ctx.translate(x, gy); ctx.scale(sc, sc);
  const g = ctx.createRadialGradient(-34, -190, 10, 0, -140, 120); g.addColorStop(0, '#F4F8FF'); g.addColorStop(0.55, '#A9B8D2'); g.addColorStop(1, '#52627E');

  ctx.strokeStyle = '#1f2635'; ctx.lineWidth = 7; ctx.lineCap = 'round'; [-36, 36].forEach(ex => { ctx.beginPath(); ctx.arc(ex, -134, 13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
  ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, -120, 20, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); ctx.restore();
}
function ticker(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); ctx.shadowColor = 'rgba(232,207,148,0.6)'; ctx.shadowBlur = 40;
  ctx.beginPath(); ctx.roundRect(-190, -110, 380, 220, 20); ctx.fillStyle = '#141414'; ctx.fill(); ctx.shadowBlur = 0; ctx.strokeStyle = '#C9A96A'; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = '#E8CF94'; ctx.textAlign = 'center'; ctx.font = `italic 700 120px "Noto Serif", serif`; ctx.fillText('ANT', 0, 40);
  ctx.fillStyle = '#8E8E93'; ctx.font = `700 28px ${SANS}`; ctx.letterSpacing = '8px'; ctx.fillText('NASDAQ', 0, -62); ctx.restore();
}
function outlined(str, x, y, size, fill, stroke, lw, glow, align = 'center') {
  ctx.save(); ctx.font = `900 ${size}px ${SANS}`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 36; }
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); ctx.shadowBlur = 0; ctx.fillStyle = fill; ctx.fillText(str, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function glow(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 20, x, y, r); g.addColorStop(0, rgb(col, a)); g.addColorStop(1, rgb(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function pill(cx, y, w, h, font, str) {
  ctx.save(); rr(cx - w / 2, y, w, h, h / 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.font = `900 ${font}px ${SANS}`; ctx.letterSpacing = '8px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(str, cx + 4, y + h * 0.7); ctx.restore();
}
function spark(x, y, r) {                                       // a small gold star between the two animals
  ctx.save(); ctx.shadowColor = 'rgba(255,220,120,0.9)'; ctx.shadowBlur = 30; ctx.fillStyle = '#FFE08A'; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * 0.28 : r, an = i / 8 * 6.283 - Math.PI / 2; ctx.lineTo(x + Math.cos(an) * rad, y + Math.sin(an) * rad); } ctx.closePath(); ctx.fill(); ctx.restore();
}
function silverCovered(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = '#46536c'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(0, -34, 16, 0, 6.283); ctx.stroke();
  const g0 = ctx.createLinearGradient(-130, 0, 130, 0); g0.addColorStop(0, '#56627a'); g0.addColorStop(0.3, '#F4F8FF'); g0.addColorStop(0.6, '#A9B8D2'); g0.addColorStop(1, '#46536c'); ctx.fillStyle = g0;
  ctx.beginPath(); ctx.moveTo(-36, 10); ctx.bezierCurveTo(-36, -22, 36, -22, 36, 10); ctx.bezierCurveTo(40, 100, 70, 140, 126, 176); ctx.lineTo(126, 200); ctx.lineTo(-126, 200); ctx.lineTo(-126, 176); ctx.bezierCurveTo(-70, 140, -40, 100, -36, 10); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-136, 194, 272, 28, 14); ctx.fill(); ctx.fillStyle = '#DCE5F5'; ctx.beginPath(); ctx.arc(0, 240, 21, 0, 6.283); ctx.fill();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30; ctx.beginPath(); ctx.moveTo(-160, 188); ctx.bezierCurveTo(-124, 60, -72, -64, 0, -64); ctx.bezierCurveTo(72, -64, 124, 60, 160, 188);
  for (let i = 0; i < 6; i++) { const x0 = 160 - i * 53.3, x1 = x0 - 53.3; ctx.quadraticCurveTo((x0 + x1) / 2, 188 + (i % 2 ? -22 : 26), x1, 188); } ctx.closePath();
  const g = ctx.createLinearGradient(-160, 0, 160, 0); g.addColorStop(0, '#59606f'); g.addColorStop(0.35, '#b4bbca'); g.addColorStop(0.65, '#858c9c'); g.addColorStop(1, '#474d5b'); ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(40,44,54,0.45)'; ctx.lineWidth = 4; [[-30, -110, 150], [24, 70, 170], [60, 128, 160]].forEach(([x0, x1, y1]) => { ctx.beginPath(); ctx.moveTo(x0, -30); ctx.quadraticCurveTo((x0 + x1) / 2 + 10, 60, x1, y1); ctx.stroke(); });
  ctx.restore();
}
function beamC(x0, x1, y) { const g = ctx.createLinearGradient(0, y - 14, 0, y + 14); g.addColorStop(0, '#E8CF94'); g.addColorStop(1, '#7a5b28'); ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x0, y - 13, x1 - x0, 26, 13); ctx.fill(); }
function ropeC(x, y0, y1, c) { ctx.strokeStyle = c; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke(); }
function crackC(cx, cy, seed) {
  let a = seed; const rnd = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  ctx.save(); ctx.translate(cx, cy); ctx.strokeStyle = 'rgba(255,248,225,0.9)'; ctx.shadowColor = 'rgba(255,240,200,0.9)'; ctx.shadowBlur = 12; ctx.lineJoin = 'miter';
  const rays = []; for (let i = 0; i < 14; i++) { const an = i / 14 * 6.283 + (rnd() - 0.5) * 0.3, pts = [[0, 0]]; let d = 0; while (d < 900) { d += 60 + rnd() * 120; const a2 = an + (rnd() - 0.5) * 0.28; pts.push([Math.cos(a2) * d, Math.sin(a2) * d]); } rays.push(pts); ctx.lineWidth = 4 - (i % 3) * 0.8; ctx.beginPath(); pts.forEach(([x, y], j) => j ? ctx.lineTo(x, y) : ctx.moveTo(0, 0)); ctx.stroke(); }
  ctx.lineWidth = 2; [2, 4].forEach(k => { ctx.beginPath(); rays.forEach((p, i) => { const q = p[Math.min(k, p.length - 1)]; i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.closePath(); ctx.stroke(); }); ctx.restore();
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!WIDE) {
    glow(540, 1050, 640, GOLDC, 0.32);
    outlined('Anthropic vs OpenAI', 540, 215, 100, '#ffffff', '#000', 14, 'rgba(255,255,255,0.35)');
    outlined('两口钟', 540, 450, 220, '#fff200', '#000', 18, 'rgba(255,230,0,0.45)');
    pill(540, 540, 880, 104, 56, '一口先响，一口蒙着布');
    crackC(540, 1060, 7); ctx.save(); ctx.globalAlpha = 0.9; silverCovered(840, 905, 1.0); ctx.restore();
    bell(430, 850, 2.0);
    ctx.save(); ctx.translate(790, 1230); ctx.rotate(-0.09); ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 12;
    ctx.beginPath(); ctx.moveTo(-250, 0); ctx.lineTo(-190, -105); ctx.lineTo(250, -105); ctx.lineTo(250, 105); ctx.lineTo(-190, 105); ctx.closePath(); ctx.fillStyle = '#EDE4D3'; ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(-205, 0, 15, 0, 6.283); ctx.fill();
    ctx.font = `900 84px ${SANS}`; ctx.fillStyle = '#2a2118'; ctx.textAlign = 'center'; ctx.fillText('≈1.3万亿', 20, 22); ctx.font = `700 28px ${SANS}`; ctx.fillStyle = '#6b5a40'; ctx.fillText('美元 · 上市估值 · 据报道', 20, 70); ctx.restore();
    ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center'; ctx.fillText('@比特双子', 540, 1412); ctx.restore();
  } else {
    glow(1000, 700, 560, GOLDC, 0.32);
    outlined('Anthropic vs OpenAI', 400, 200, 72, '#ffffff', '#000', 13, 'rgba(255,255,255,0.35)', 'center');
    outlined('两口钟', 400, 410, 190, '#fff200', '#000', 17, 'rgba(255,230,0,0.45)', 'center');
    pill(400, 480, 680, 96, 48, '一口先响，一口蒙着布');
    beamC(780, 1420, 330); ropeC(960, 330, 400, '#C9A96A'); ropeC(1260, 330, 400, '#A9B8D2'); bell(960, 450, 1.05); silverCovered(1260, 450, 1.05);
    ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center'; ctx.fillText('@比特双子', W / 2, 1050); ctx.restore();
  }
}
window.ready = (async () => {
  const sample = 'Anthropic vs OpenAI两口钟一口先响，一口蒙着布@比特双子';
  await Promise.all([document.fonts.load(`900 100px ${SANS}`, sample), document.fonts.load(`700 26px ${SANS}`, sample)]);
  await document.fonts.ready; draw(); return true;
})();
</script></body></html>
