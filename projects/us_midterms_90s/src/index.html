<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>美国中期选举一次看懂</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-serif-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/eb-garamond/400-italic.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Every frame is a pure function of time t (seconds). No requestAnimationFrame,
// no Date, no unseeded randomness — so frame-by-frame rendering is repeatable.
const TL = window.TL;                 // injected by render.js from timeline.json
const BEAT = 60 / TL.bpm;
const b = n => n * BEAT;              // beat index -> seconds
// The title card lasts INTRO seconds; beat n >= TB is placed INTRO + (n - TB) beats into the video.
const INTRO = TL.intro_seconds, TB = TL.scenes_beats.D_title[1];
const T = n => n < TB ? n / TB * INTRO : INTRO + (n - TB) * BEAT;
const S = Object.fromEntries(Object.entries(TL.scenes_beats).map(([k, [s, e]]) => [k, [T(s), T(e)]]));
const DURATION = T(TL.total_beats) + TL.tail_seconds;

const W = 1920, H = 1080;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- palette & fonts ----------
const C = {
  bgIn: '#0e0e0e', bgOut: '#000000',
  text: '#EAEAF2', gray: '#8E8E93', gold: '#C9A96A', goldHi: '#E8CF94',
  paper: '#EDE4D3', red: '#B53A2F',
};
const F = {
  serif: '"Noto Serif SC"',
  sans: '"Noto Sans SC"',
  en: '"EB Garamond"',
};

// ---------- math helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));
const easeIO = k => k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// fade in over fi, hold, fade out over fo, inside [t0, t1]
const window01 = (t, t0, t1, fi = 0.4, fo = 0.35) => Math.min(prog(t, t0, t0 + fi), 1 - prog(t, t1 - fo, t1));

// ---------- static random fields (seeded) ----------
const STARS = (() => { const r = mulberry32(7); return Array.from({ length: 220 }, () => ({ x: r() * W, y: r() * H, s: 0.4 + r() * 1.3, ph: r() * 6.28, sp: 0.4 + r() * 1.2 })); })();
const DUST = (() => { const r = mulberry32(11); return Array.from({ length: 46 }, () => ({ x: r() * W, y: r() * H, s: 0.8 + r() * 2.2, vx: (r() - .5) * 14, vy: -6 - r() * 16, ph: r() * 6.28 })); })();

// ---------- text helpers ----------
function text(str, x, y, { size = 40, family = F.sans, weight = 400, color = C.text, align = 'center', alpha = 1, italic = false, spacing = 0, baseline = 'alphabetic' } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${family}`;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y);
  ctx.restore();
}

// Bilingual subtitle band at 85–91% height
function subtitle(t, t0, t1, zh, en) {
  const a = window01(t, t0, t1);
  if (a <= 0) return;
  const rise = (1 - easeOut(prog(t, t0, t0 + 0.4))) * 8;
  text(zh, W / 2, 948 + rise, { size: 46, weight: 700, alpha: a, spacing: 2 });
  text(en, W / 2, 996 + rise, { size: 28, family: F.en, italic: true, color: C.gray, alpha: a * 0.95 });
}

// Small note band at ~70% height
function note(t, t0, t1, str, x = W / 2, y = 790) {
  const a = window01(t, t0, t1, 0.35, 0.3);
  text(str, x, y, { size: 24, color: C.gray, alpha: a, spacing: 1 });
}

function topLabel(t, t0, t1, str) {
  const a = window01(t, t0, t1, 0.5, 0.4);
  if (a <= 0) return;
  text(str, W / 2, 74, { size: 24, color: C.gold, alpha: a * 0.85, spacing: 6 });
  ctx.save(); ctx.globalAlpha = a * 0.5; ctx.strokeStyle = C.gold; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W / 2 - 40, 92); ctx.lineTo(W / 2 + 40, 92); ctx.stroke(); ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function heart(x, y, s, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, 3);
  ctx.bezierCurveTo(-7, -3, -4, -9, 0, -5); ctx.bezierCurveTo(4, -9, 7, -3, 0, 3);
  ctx.fill(); ctx.restore();
}

function glowDot(x, y, r, color, glow, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * glow);
  g.addColorStop(0, color); g.addColorStop(0.25, color.replace(/[\d.]+\)$/, '0.35)')); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * glow, 0, 6.283); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.restore();
}

// ---------- background ----------
function background(t, frame) {
  const g = ctx.createRadialGradient(W / 2, H * 0.45, 80, W / 2, H * 0.5, W * 0.7);
  g.addColorStop(0, C.bgIn); g.addColorStop(1, C.bgOut);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    const a = 0.15 + 0.35 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph));
    ctx.fillStyle = `rgba(220,220,240,${a})`;
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
}
function dust(t, alpha = 1) {
  for (const d of DUST) {
    const x = ((d.x + d.vx * t) % W + W) % W;
    const y = ((d.y + d.vy * t) % H + H) % H;
    const a = alpha * (0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.3 + d.ph)));
    ctx.fillStyle = `rgba(232,207,148,${a})`;
    ctx.beginPath(); ctx.arc(x, y, d.s, 0, 6.283); ctx.fill();
  }
}
function finish(t, frame) {
  // vignette
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // film grain, reseeded every frame
  const r = mulberry32(1000 + frame);
  for (let i = 0; i < 1800; i++) {
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    ctx.fillRect(r() * W, r() * H, 2, 2);
  }
  // watermark
  text(TL.watermark, 60, 74, { size: 24, align: 'left', color: C.text, alpha: 0.35 });
  // end fade (sample only)
  const k = prog(t, DURATION - 0.6, DURATION);
  if (k > 0) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); }
}

// =====================================================================
//  《熬一个通宵 ≈ 醉驾？》
//  Transitions: neighbouring scenes overlap and "push" through each other (old one shrinks and
//  fades while the new one settles from slightly larger), so there is never a dark gap.
// =====================================================================
const AMBER = '#E8A33A', RED = '#E0554A';
const DRIFT = t => [6 * Math.sin(t * 0.31), 4 * Math.sin(t * 0.23 + 1)];
function scene(t, key, fn, o = {}) {
  const [s0, s1] = S[key];
  const fi = o.fi ?? 0.45, fo = o.fo ?? 0.4;
  // staggered hand-over: the old scene is almost gone by the boundary, the new one pushes in right after it
  const kin = s0 <= 0 ? 1 : easeOut(prog(t, s0 - 0.1, s0 - 0.1 + fi));
  const kout = easeIO(prog(t, s1 - fo + 0.1, s1 + 0.1));
  if (kin <= 0 || kout >= 1) return;
  const sc = lerp(o.zin ?? 1.07, 1, kin) * lerp(1, o.zout ?? 0.93, kout) * (1 + 0.035 * prog(t, s0, s1));   // slow push-in inside every scene
  const [dx, dy] = DRIFT(t);
  ctx.save(); ctx.globalAlpha *= kin * (1 - kout);
  ctx.translate(W / 2 + dx, 470 + dy); ctx.scale(sc, sc); ctx.translate(-W / 2, -470);
  fn(t - s0);
  ctx.restore();
}
// subtitles / labels slide: in from below, out upwards — consecutive lines hand over without a dip
function slideText(t, t0, t1, draw) {
  const kin = easeOut(prog(t, t0, t0 + 0.18)), kout = easeIO(prog(t, t1 - 0.16, t1));
  const a = kin * (1 - kout); if (a <= 0) return;
  draw(a, (1 - kin) * 16 - kout * 14);
}
function sub(t, t0, t1, zh, en) {
  slideText(t, t0, t1, (a, dy) => {
    text(zh, W / 2, 948 + dy, { size: 46, weight: 700, alpha: a, spacing: 2 });
    text(en, W / 2, 996 + dy, { size: 28, family: F.en, italic: true, color: C.gray, alpha: a * 0.95 });
  });
}
function label(t, t0, t1, str) {
  slideText(t, t0, t1, (a, dy) => {
    text(str, W / 2, 74 + dy, { size: 24, color: C.gold, alpha: a * 0.85, spacing: 6 });
    ctx.save(); ctx.globalAlpha *= a * 0.5; ctx.strokeStyle = C.gold; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2 - 40, 92 + dy); ctx.lineTo(W / 2 + 40, 92 + dy); ctx.stroke(); ctx.restore();
  });
}

// ---------- reusable drawings ----------
function clockFace(x, y, R, hours, a = 1, glow = 0) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  if (glow > 0) { const g = ctx.createRadialGradient(0, 0, R * 0.2, 0, 0, R * 1.6); g.addColorStop(0, `rgba(232,207,148,${0.18 * glow})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 1.6, 0, 6.283); ctx.fill(); }
  ctx.strokeStyle = 'rgba(234,234,242,0.85)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.stroke();
  for (let i = 0; i < 60; i++) { const an = i / 60 * 6.283, big = i % 5 === 0; ctx.strokeStyle = big ? 'rgba(234,234,242,0.9)' : 'rgba(234,234,242,0.3)'; ctx.lineWidth = big ? 5 : 2; ctx.beginPath(); ctx.moveTo(Math.cos(an) * (R - (big ? 26 : 12)), Math.sin(an) * (R - (big ? 26 : 12))); ctx.lineTo(Math.cos(an) * (R - 6), Math.sin(an) * (R - 6)); ctx.stroke(); }
  const ha = (hours % 12) / 12 * 6.283 - Math.PI / 2, ma = (hours % 1) * 6.283 - Math.PI / 2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = C.goldHi; ctx.lineWidth = 12; ctx.shadowColor = 'rgba(232,207,148,0.6)'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ha) * R * 0.5, Math.sin(ha) * R * 0.5); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ma) * R * 0.78, Math.sin(ma) * R * 0.78); ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = C.goldHi; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.283); ctx.fill();
  ctx.restore();
}
function hhmm(h) { h = ((h % 24) + 24) % 24; const H = Math.floor(h), M = Math.floor((h - H) * 60); return String(H).padStart(2, '0') + ':' + String(M).padStart(2, '0'); }
function card(x, y, w, h, a = 1, glow = 0.45) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = `rgba(232,207,148,${glow})`; ctx.shadowBlur = 36;
  roundRect(x - w / 2, y - h / 2, w, h, 20); ctx.fillStyle = '#141414'; ctx.fill(); ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(201,169,106,0.55)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}
function noteCard(x, y, w, big, small, rot, k, a = 1) {
  if (k <= 0) return;
  const drop = (1 - easeOut(Math.min(1, k))) * 260;
  ctx.save(); ctx.globalAlpha *= a * Math.min(1, k * 3); ctx.translate(x, y - drop); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  roundRect(-w / 2, -110, w, 220, 8); ctx.fillStyle = '#EDE4D3'; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  text(big, 0, -6, { size: 40, weight: 700, color: '#2a2118' });
  text(small, 0, 52, { size: 24, color: '#6b5a40' });
  ctx.restore();
}

// ---------- shared characters & effects ----------
function person(x, y, s, col = C.goldHi, rot = 0, a = 1) {   // (x, y) = feet
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, -62, 17, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-27, 0); ctx.quadraticCurveTo(-29, -40, 0, -40); ctx.quadraticCurveTo(29, -40, 27, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
const SPARKS = (() => { const r = mulberry32(97); return Array.from({ length: 28 }, () => ({ an: r() * 6.283, sp: 220 + r() * 520, s: 2 + r() * 4, red: r() < 0.5 })); })();
function burst(x, y, age, scale = 1) {
  if (age < 0 || age > 0.8) return;
  SPARKS.forEach(p => {
    const d = p.sp * scale * (age - 0.6 * age * age), a = 1 - age / 0.8;
    ctx.fillStyle = p.red ? `rgba(224,85,74,${a})` : `rgba(245,214,150,${a})`;
    ctx.beginPath(); ctx.arc(x + Math.cos(p.an) * d, y + Math.sin(p.an) * d, p.s * (1 - age), 0, 6.283); ctx.fill();
  });
}


// =====================================================================
//  Midterms-specific drawing. Motifs: the term clock + a huge faint balance scale, cream paper cards,
//  a red stamp, a crowd of little people (Senate) that morphs into the House dots, a gauge whose reading
//  crosses the majority line on the drum drop, and a step-by-step ending.
// =====================================================================
const BLUE = [91, 141, 239], REDP = [210, 73, 63], GREYP = [106, 110, 122], PALE = [169, 195, 245], DIMC = [70, 74, 88], DIMR = [150, 62, 58];
const rgb = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const mixc = (c1, c2, k) => [lerp(c1[0], c2[0], k), lerp(c1[1], c2[1], k), lerp(c1[2], c2[2], k)];
const shakeAt = (t, t0) => { const a = t - t0; return a > 0 && a < 0.5 ? 8 * Math.exp(-9 * a) * Math.sin(70 * a) : 0; };
const pulseAt = (t, t0, w = 0.16) => Math.exp(-Math.pow((t - t0) / w, 2));
const ovAlpha = (t, s0, s1) => easeOut(prog(t, s0 - 0.1, s0 + 0.35)) * (1 - easeIO(prog(t, s1 - 0.3, s1 + 0.1)));

// ---------- the balance scale (also the huge faint glue layer) ----------
function balance(x, y, s, tilt, a = 1, line = 'rgba(234,234,242,0.9)', lw = 6) {
  const L = 280, ex = L * Math.cos(tilt), ey = L * Math.sin(tilt);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 330); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-120, 345); ctx.lineTo(120, 345); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-ex, -ey); ctx.lineTo(ex, ey); ctx.stroke();
  [[-ex, -ey], [ex, ey]].forEach(([px, py]) => {
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - 70, py + 150); ctx.moveTo(px, py); ctx.lineTo(px + 70, py + 150); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py + 150, 70, 0, Math.PI); ctx.stroke();
  });
  ctx.fillStyle = line; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.283); ctx.fill();
  ctx.restore();
  return { L: [x - ex * s, y + (-ey + 150) * s], R: [x + ex * s, y + (ey + 150) * s] };
}
function glue(t) {
  balance(W / 2, 300, 1.55, 0.14 * Math.sin(t * 0.35), 0.07, 'rgba(234,234,242,1)', 3);
  let p = 0; Object.entries(S).forEach(([k, [s0]]) => { if (s0 > 0) p = Math.max(p, Math.exp(-Math.pow((t - s0) / 0.22, 2))); });
  if (p > 0.01) { const g = ctx.createRadialGradient(W / 2, 470, 20, W / 2, 470, 900); g.addColorStop(0, `rgba(232,207,148,${0.13 * p})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
}

// ---------- icons (gold line art, drawn around the origin) ----------
function iconDome() {
  ctx.strokeStyle = C.goldHi; ctx.fillStyle = C.goldHi; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-72, 48); ctx.lineTo(72, 48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-56, 48); ctx.lineTo(-56, 6); ctx.lineTo(56, 6); ctx.lineTo(56, 48); ctx.stroke();
  [-34, -11, 11, 34].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 6); ctx.lineTo(x, 48); ctx.stroke(); });
  ctx.beginPath(); ctx.arc(0, 6, 40, Math.PI, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, -54); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -58, 5, 0, 6.283); ctx.fill();
}
function iconSenate() {
  ctx.fillStyle = C.goldHi;
  [[22, 5], [42, 8], [62, 11]].forEach(([r, n]) => { for (let i = 0; i < n; i++) { const an = Math.PI + (i + 0.5) / n * Math.PI; ctx.beginPath(); ctx.arc(Math.cos(an) * r * 1.2, 30 + Math.sin(an) * r, 6.5, 0, 6.283); ctx.fill(); } });
  ctx.strokeStyle = C.goldHi; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-84, 44); ctx.lineTo(84, 44); ctx.stroke();
}
function iconFlag() {
  ctx.strokeStyle = C.goldHi; ctx.fillStyle = C.goldHi; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-30, 55); ctx.lineTo(-30, -55); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-30, -55); ctx.lineTo(50, -38); ctx.lineTo(-30, -14); ctx.closePath(); ctx.fill();
}
function iconCalendar(txt) {
  ctx.strokeStyle = C.goldHi; ctx.fillStyle = C.goldHi; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  roundRect(-62, -50, 124, 104, 12); ctx.stroke(); ctx.fillRect(-62, -50, 124, 28);
  [-34, 34].forEach(x => { ctx.beginPath(); ctx.moveTo(x, -64); ctx.lineTo(x, -38); ctx.stroke(); });
  text(txt, 0, 36, { size: 40, weight: 700, color: C.goldHi });
}
function iconWhiteHouse() {
  ctx.strokeStyle = C.goldHi; ctx.lineWidth = 5; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-78, 48); ctx.lineTo(78, 48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-60, 48); ctx.lineTo(-60, 0); ctx.lineTo(60, 0); ctx.lineTo(60, 48); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(0, -40); ctx.lineTo(70, 0); ctx.closePath(); ctx.stroke();
  [-36, -12, 12, 36].forEach(x => { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 48); ctx.stroke(); });
}
function iconGauge(needle) {
  ctx.strokeStyle = 'rgba(234,234,242,0.55)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 30, 60, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = RED; ctx.beginPath(); ctx.arc(0, 30, 60, Math.PI, Math.PI * 1.33); ctx.stroke();
  const an = Math.PI + needle * Math.PI; ctx.strokeStyle = C.goldHi; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(Math.cos(an) * 50, 30 + Math.sin(an) * 50); ctx.stroke();
  ctx.fillStyle = C.goldHi; ctx.beginPath(); ctx.arc(0, 30, 8, 0, 6.283); ctx.fill();
}
function iconSplit(k) {                      // district lines sliding
  ctx.strokeStyle = C.goldHi; ctx.lineWidth = 5; ctx.lineJoin = 'round'; roundRect(-70, -45, 140, 90, 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-70 + 40 + 30 * k, -45); ctx.lineTo(-10 + 20 * k, 0); ctx.lineTo(20 + 30 * k, 45); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-70, 5 - 15 * k); ctx.lineTo(10 + 20 * k, -5); ctx.lineTo(70, 20 + 10 * k); ctx.stroke();
}
function ballotBox(x, y, s, k) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

      ctx.strokeStyle = 'rgba(234,234,242,0.5)'; ctx.lineWidth = 4; [-30, 0, 30].forEach(dy => { ctx.beginPath(); ctx.moveTo(-60, dy); ctx.lineTo(60, dy); ctx.stroke(); });
      const mx = -50 + 100 * (0.5 + 0.5 * Math.sin(a0 * 3)), my = 12 * Math.sin(a0 * 4.3);
      ctx.strokeStyle = C.goldHi; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(mx, my, 30, 0, 6.283); ctx.stroke(); ctx.beginPath(); ctx.moveTo(mx + 22, my + 22); ctx.lineTo(mx + 56, my + 56); ctx.stroke();
    } else if (i === 1) {
      const p = easeOut(prog(a0, 0.1, 0.9)); ctx.strokeStyle = C.goldHi; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(-80, 0);
      for (let q2 = 0; q2 <= 16 * p; q2++) ctx.lineTo(-80 + q2 * 10, (q2 % 2 ? -22 : 22)); ctx.stroke();
      ctx.lineWidth = 3; for (let q2 = 1; q2 <= 15 * p; q2 += 2) { const px = -80 + q2 * 10; ctx.beginPath(); ctx.moveTo(px - 8, -30); ctx.lineTo(px + 8, -14); ctx.moveTo(px - 8, -14); ctx.lineTo(px + 8, -30); ctx.stroke(); }
    } else {
      const f = prog(a0, 0.5, 1.0); ctx.save(); ctx.scale(1, Math.abs(Math.cos(f * Math.PI))); iconCalendar(f < 0.5 ? '2026' : '2028'); ctx.restore();
    }
    ctx.restore();
    text(lab, -60, 18, { size: 54, family: F.serif, weight: 900, color: i === 2 ? C.goldHi : C.text, align: 'left' });
    text(['民主党筹划对政府的调查', '两党互相牵制，法案难通过', '中期 ≠ 总统选举'][i], -60, 62, { size: 26, color: C.gray, align: 'left' });
    ctx.restore();
  });
}

// ---------- J: closing question ----------
function sceneEnd(lt, t) {
  const bk = ctx.createRadialGradient(960, 560, 40, 960, 560, 560); bk.addColorStop(0, 'rgba(0,0,0,0.7)'); bk.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = bk; ctx.fillRect(300, 250, 1320, 620);
  dust(t, 0.9);
  const pans = balance(960, 120, 0.42, 0.0, 0.9, 'rgba(232,207,148,0.9)', 8);
  elephant(pans.L[0], pans.L[1] + 4, 0.2, { t, mood: 1 }); donkey(pans.R[0], pans.R[1] + 4, 0.2, { t, mood: 1 });
  const sg = easeBack(prog(lt, 0, 0.4));
  glowDot(960, 330, 16 * Math.max(0.01, sg), 'rgba(245,214,150,0.98)', 6);
  text('你觉得，分裂政府', 960, 500, { size: 84, weight: 700, alpha: prog(lt, 0.1, 0.45) });
  text('会带来什么？', 960, 610, { size: 84, weight: 700, color: C.goldHi, alpha: prog(lt, 0.3, 0.65) });
  text('What will divided government bring?', 960, 684, { size: 36, family: F.en, italic: true, color: C.gray, alpha: prog(lt, 0.55, 0.9) });
  elephant(430, 830, 1.0, { t, mood: 1, a: prog(lt, b(0.8), b(1.2)) }); donkey(1490, 830, 0.95, { t, mood: 1, a: prog(lt, b(0.8), b(1.2)) });
  text('数据：CBS · AP · Gallup · FiveThirtyEight  |  截至 2026.11.9，仍在计票', 960, 800, { size: 22, color: C.gray, alpha: 0.85 * prog(lt, b(1.5), b(1.9)) });
}

// ---------- compose ----------
function render(t, frame = Math.round(t * TL.fps)) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  background(t, frame); glue(t); dust(t, 0.45);
  sceneTitleCard(t);
  scene(t, 'A_what', lt => sceneWhat(lt, t));
  scene(t, 'B_gate', lt => sceneGate(lt, t));
  scene(t, 'C_balloons', lt => sceneBalloons(lt, t));
  scene(t, 'D_before', lt => sceneBefore(lt, t));
  scene(t, 'E_senate', lt => sceneSenate(lt, t), { zin: 1, zout: 1 });
  scene(t, 'F_house', lt => sceneHouse(lt, t));
  scene(t, 'G_gov', lt => sceneGov(lt, t));
  scene(t, 'H_why', lt => sceneWhy(lt, t));
  scene(t, 'I_next', lt => sceneNext(lt, t));
  scene(t, 'J_end', lt => sceneEnd(lt, t), { zin: 1, zout: 1, fi: 0.6, fo: 0.01 });
  const L = (k, s2) => label(t, S[k][0] + 0.15, S[k][1] - 0.1, s2);
  L('A_what', '什 么 是 中 期 选 举'); L('B_gate', '总 统 为 什 么 在 乎 国 会'); L('C_balloons', '历 史 规 律'); L('D_before', '选 前 局 势');
  L('E_senate', '参 议 院'); L('F_house', '众 议 院'); L('G_gov', '州 长'); L('H_why', '为 什 么 会 这 样'); L('I_next', '接 下 来'); L('J_end', '展 望');
  const s = (n0, n1, zh, en) => sub(t, T(n0) + 0.05, T(n1), zh, en);
  s(4, 8, '总统任期走到一半，选民给国会重新投票', 'Halfway through a presidential term, voters re-elect Congress.');
  s(8, 12, '两大政党的标志：共和党是大象，民主党是驴', 'The two parties: the Republican elephant and the Democratic donkey.');
  s(12, 16, '国会点头，总统的法案才能通过', 'Congress has to say yes before a president’s bills pass.');
  s(16, 20, '国会被对手拿下，议程就推不动', 'If the other party takes Congress, the agenda stalls.');
  s(20, 25, '历史规律：总统所在的党，期中选举常常丢席位', "History: the president's party usually loses seats at midterms.");
  s(25, 30, '平均丢二十多个；总统不受欢迎时，丢得更多', 'About two dozen on average — more when the president is unpopular.');
  s(30, 34, '选举前，共和党同时掌握白宫和国会两院', 'Before the vote, Republicans held the White House and both chambers.');
  s(34, 38, '但总统支持率偏低，选民心里有气', 'But the president’s approval was low, and voters were unhappy.');
  s(38, 41, '先看参议院：原本共和党占多数', 'The Senate first: Republicans had the majority.');
  s(41, 46.6, '民主党从共和党手里翻转了 7 个席位', 'Democrats flipped seven seats from the Republicans.');
  s(46.6, 48, '参议院，易主了', 'The Senate has changed hands.');
  s(48, 51, '再看众议院：民主党也拿下了多数', 'The House: Democrats win the majority too.');
  s(51, 54, '计票仍在继续，但多家媒体已经宣布', 'Counting goes on, but several networks have called it.');
  s(54, 58, '州长也有变化：德州出现三十多年来首位民主党州长', 'Governors: Texas elects its first Democrat in over thirty years.');
  s(58, 63, '原因：物价高、油价涨，还有伊朗战争', 'Why: high prices, rising gas, and the Iran war.');
  s(63, 68, '总统支持率又偏低，选民就用选票表达不满', 'With the president unpopular, voters spoke at the ballot box.');
  s(68, 75, '新国会明年 1 月就职：议长有望易主，调查随之展开', 'In January: a likely new Speaker, and investigations.');
  s(75, 82, '两党互相牵制，立法容易僵局，目光转向 2028', 'Expect gridlock — and all eyes turn to 2028.');
  s(82, 86, '这是一场期中考，也是下一场较量的起点', 'A report card, and the start of the next contest.');
  s(86, 90, '你觉得，分裂政府会带来什么？', 'What will divided government bring?');
  finish(t, frame);
}

window.ALL_TEXT = document.documentElement.innerHTML;
window.ready = (async () => {
  const sample = window.ALL_TEXT;
  await Promise.all([
    document.fonts.load(`900 92px ${F.serif}`, sample),
    document.fonts.load(`400 40px ${F.sans}`, sample),
    document.fonts.load(`700 40px ${F.sans}`, sample),
    document.fonts.load(`italic 400 30px ${F.en}`, sample),
  ]);
  await document.fonts.ready;
  return { duration: DURATION, frames: Math.ceil(DURATION * TL.fps) };
})();
window.render = render;
</script>
