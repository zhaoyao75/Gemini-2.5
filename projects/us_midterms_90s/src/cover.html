<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1440"></canvas>
<script>
// Covers: 3:4 (1080x1440) and 4:3 (#43, 1440x1080). Black ground, white + yellow heavy title, a pill subtitle,
// and the Republican elephant (red) and the Democratic donkey (blue) facing each other.
const WIDE = location.hash === '#43';
const W = WIDE ? 1440 : 1080, H = WIDE ? 1080 : 1440, cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d'), SANS = '"Noto Sans SC"';
const rgb = (c, a = 1) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a})`;
const EL = [210, 73, 63], ELD = [168, 58, 50], ELI = [238, 156, 147], DK = [91, 141, 239], DKD = [62, 107, 196], DKI = [191, 211, 248];
function ell(x, y, rx, ry, rot, col) { ctx.fillStyle = rgb(col); ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 6.283); ctx.fill(); }
function face(ex, ey, mood, t, s = 1) {          // an eye (+ brow / tear) at (ex, ey)
  ctx.save(); ctx.translate(ex, ey); ctx.scale(s, s);
  if (mood > 0) { ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 4, 8, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  else {
    const bl = (Math.sin(t * 2.3 + ex) > 0.96) ? 0.15 : 1;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(0, 0, 9, 10 * bl, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#1b1b1b'; ctx.beginPath(); ctx.ellipse(1.5, 1, 5, 6 * bl, 0, 0, 6.283); ctx.fill();
    if (mood < 0) { ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-12, -18); ctx.lineTo(10, -10); ctx.stroke(); ctx.fillStyle = 'rgba(120,190,255,0.9)'; ctx.beginPath(); ctx.ellipse(4, 22 + 4 * Math.sin(t * 5), 4, 7, 0, 0, 6.283); ctx.fill(); }
  }
  ctx.restore();
}
function elephant(x, y, s = 1, o = {}) {
  const { mood = 0, flip = false, t = 0, trunk = 0, a = 1, walk = 0, hop = 0 } = o;
  const bob = 4 * Math.sin(t * 3.2) - hop;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y + bob * 0); ctx.scale(flip ? -s : s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(0, 4, 84, 10, 0, 0, 6.283); ctx.fill();
  ctx.translate(0, -hop);
  const sw = walk * 7 * Math.sin(t * 9);
  [[-54, sw], [14, -sw]].forEach(([lx, d]) => { ctx.fillStyle = rgb(ELD); ctx.beginPath(); ctx.roundRect(lx + d, -40, 36, 42, 11); ctx.fill(); });
  ctx.strokeStyle = rgb(ELD); ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-76, -98); ctx.quadraticCurveTo(-104 + 6 * Math.sin(t * 4), -84, -102, -58); ctx.stroke();
  ell(0, -86 + bob * 0.3, 84, 58, 0, EL);
  ell(-10, -70, 54, 30, 0, [224, 98, 88]);
  ell(40, -122 + bob * 0.4, 38, 46, 0, ELD); ell(40, -122 + bob * 0.4, 25, 33, 0, ELI);     // far ear
  ell(70, -124 + bob * 0.4, 52, 50, 0, EL);                                                      // head
  const tr = trunk;                                                                                  // trunk: 0 hanging, 1 raised
  ctx.strokeStyle = rgb(EL); ctx.lineWidth = 28; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(104, -112 + bob * 0.4);
  ctx.bezierCurveTo(138, -100 - 40 * tr, 138 + 10 * tr, -50 - 90 * tr, 112 + 20 * tr, -34 - 130 * tr); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(100, -92 + bob * 0.4); ctx.quadraticCurveTo(128, -88, 126, -66); ctx.stroke();   // tusk
  ell(36, -112 + bob * 0.4, 30, 38, 0.15, [190, 66, 58]); ell(36, -112 + bob * 0.4, 20, 27, 0.15, ELI);                                                                 // near ear
  face(88, -138 + bob * 0.4, mood, t);
  if (mood >= 0) { ctx.fillStyle = 'rgba(255,170,160,0.55)'; ctx.beginPath(); ctx.ellipse(76, -108 + bob * 0.4, 9, 6, 0, 0, 6.283); ctx.fill(); }
  ctx.restore();
}
function donkey(x, y, s = 1, o = {}) {
  const { mood = 0, flip = false, t = 0, a = 1, walk = 0, hop = 0 } = o;
  const bob = 4 * Math.sin(t * 3.4 + 1);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(flip ? -s : s, s);
  ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.ellipse(0, 4, 78, 10, 0, 0, 6.283); ctx.fill();
  ctx.translate(0, -hop);
  const sw = walk * 7 * Math.sin(t * 9);
  [[-48, -sw], [20, sw]].forEach(([lx, d]) => { ctx.fillStyle = rgb(DKD); ctx.beginPath(); ctx.roundRect(lx + d, -38, 28, 40, 10); ctx.fill(); });
  ctx.strokeStyle = rgb(DKD); ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(72, -94); ctx.quadraticCurveTo(100, -84 + 8 * Math.sin(t * 5), 98, -56); ctx.stroke();
  ell(100, -54, 8, 17, 0.2, DKD);
  ell(0, -82 + bob * 0.3, 78, 50, 0, DK);
  ell(-8, -66, 50, 26, 0, [118, 160, 244]);
  ctx.fillStyle = rgb(DKD); [[-58, -150], [-50, -158], [-42, -164]].forEach(([mx, my]) => { ctx.beginPath(); ctx.roundRect(mx - 5, my + bob * 0.4, 10, 26, 4); ctx.fill(); });   // mane
  ell(-52, -168 + bob * 0.4, 13, 42, 0.35, DKD); ell(-52, -168 + bob * 0.4, 7, 30, 0.35, DKI);     // far ear
  ell(-70, -116 + bob * 0.4, 38, 46, 0.45, DK);                                                         // head
  ell(-92, -90 + bob * 0.4, 30, 22, 0.45, DKI);                                                         // muzzle
  ell(-98, -96 + bob * 0.4, 4, 3, 0, [40, 60, 110]);
  ell(-80, -170 + bob * 0.4, 13, 42, -0.5, DK); ell(-80, -170 + bob * 0.4, 7, 30, -0.5, DKI);       // near ear
  face(-72, -126 + bob * 0.4, mood, t);
  if (mood >= 0) { ctx.fillStyle = 'rgba(255,170,170,0.5)'; ctx.beginPath(); ctx.ellipse(-60, -100 + bob * 0.4, 9, 6, 0, 0, 6.283); ctx.fill(); }
  ctx.restore();
}


// =====================================================================
//  Cartoon scenes: the Republican elephant (red) and the Democratic donkey (blue) act the story out.
// =====================================================================
function outlined(str, x, y, size, fill, stroke, lw, glow, align = 'center') {
  ctx.save(); ctx.font = `900 ${size}px ${SANS}`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 36; }
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); ctx.shadowBlur = 0; ctx.fillStyle = fill; ctx.fillText(str, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function glow(x, y, r, col, a) { const g = ctx.createRadialGradient(x, y, 20, x, y, r); g.addColorStop(0, rgb(col, a)); g.addColorStop(1, rgb(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }
function pill(cx, y, w, h, font, str) {
  ctx.save(); rr(cx - w / 2, y, w, h, h / 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.font = `900 ${font}px ${SANS}`; ctx.letterSpacing = '8px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(str, cx + 4, y + h * 0.7); ctx.restore();
}
function spark(x, y, r) {                                       // a small gold star between the two animals
  ctx.save(); ctx.shadowColor = 'rgba(255,220,120,0.9)'; ctx.shadowBlur = 30; ctx.fillStyle = '#FFE08A'; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const rad = i % 2 ? r * 0.28 : r, an = i / 8 * 6.283 - Math.PI / 2; ctx.lineTo(x + Math.cos(an) * rad, y + Math.sin(an) * rad); } ctx.closePath(); ctx.fill(); ctx.restore();
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!WIDE) {
    glow(250, 1050, 520, EL, 0.38); glow(830, 1050, 520, DK, 0.38);
    outlined('美国中期', 540, 280, 200, '#ffffff', '#000', 18, 'rgba(255,255,255,0.35)');
    outlined('选举', 540, 510, 250, '#fff200', '#000', 20, 'rgba(255,230,0,0.45)');
    pill(540, 580, 700, 104, 62, '驴象之争');
    elephant(250, 1240, 1.95, { t: 0.3, trunk: 1, mood: 0 });
    donkey(822, 1240, 1.85, { t: 0.5, mood: 0 });
    spark(540, 1010, 46);
    ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center'; ctx.fillText('@比特双子', 540, 1412); ctx.restore();
  } else {
    glow(300, 760, 520, EL, 0.38); glow(1140, 760, 520, DK, 0.38);
    ctx.font = `900 170px ${SANS}`; const w1 = ctx.measureText('美国中期').width; ctx.font = `900 210px ${SANS}`; const w2 = ctx.measureText('选举').width;
    const x0 = (W - (w1 + w2 + 20)) / 2;
    outlined('美国中期', x0, 270, 170, '#ffffff', '#000', 18, 'rgba(255,255,255,0.35)', 'left');
    outlined('选举', x0 + w1 + 20, 270, 210, '#fff200', '#000', 20, 'rgba(255,230,0,0.45)', 'left');
    elephant(235, 990, 1.95, { t: 0.3, trunk: 1, mood: 0 });
    donkey(1170, 990, 1.9, { t: 0.5, mood: 0 });
    spark(W / 2, 640, 40);
    pill(W / 2, 700, 300, 92, 48, '驴象之争');
    ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center'; ctx.fillText('@比特双子', W / 2, 1050); ctx.restore();
  }
}
window.ready = (async () => {
  const sample = '美国中期选举驴象之争一次看懂@比特双子';
  await Promise.all([document.fonts.load(`900 100px ${SANS}`, sample), document.fonts.load(`700 26px ${SANS}`, sample)]);
  await document.fonts.ready; draw(); return true;
})();
</script></body></html>
