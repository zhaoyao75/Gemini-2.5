<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1440"></canvas>
<script>
// 3:4 Douyin cover (1080x1440). Same star-network motif as the video, drawn on gold leaf.
const W = 1080, H = 1440, ctx = document.getElementById('c').getContext('2d');
const SANS = '"Noto Sans SC"';
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function outlined(str, x, y, size, fill, stroke, lw, { align = 'center', glow = null } = {}) {
  ctx.save(); ctx.font = `900 ${size}px ${SANS}`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 36; }
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
  ctx.shadowBlur = 0; ctx.fillStyle = fill; ctx.fillText(str, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

const NODES = [[960,470],[720,330],[1210,360],[1040,640],[430,250],[560,500],[400,680],[650,160],[880,170],[1110,190],[1390,200],[1580,320],[1660,530],[1450,560],[1300,730],[820,720],[620,690],[300,450]];
const EDGES = [[0,1],[0,2],[0,3],[1,4],[1,5],[1,7],[1,8],[1,17],[1,16],[2,9],[2,10],[2,11],[2,13],[2,8],[3,14],[3,15],[3,13],[3,16],[4,7],[4,17],[5,17],[5,6],[6,16],[7,8],[9,10],[10,11],[11,12],[12,13],[13,14],[15,16],[8,9]];
const DEG = NODES.map((_, i) => EDGES.filter(e => e.includes(i)).length);
const CX = 540, CY = 1010, SC = 0.64;
const P = ([x, y]) => [CX + SC * (x - 980), CY + SC * (y - 445)];

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // golden bloom behind the circle
  let g = ctx.createRadialGradient(CX, CY, 300, CX, CY, 700);
  g.addColorStop(0, 'rgba(255,175,40,0.65)'); g.addColorStop(0.55, 'rgba(255,150,30,0.22)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 380, W, 1060);
  // gold-leaf disc
  const R = 440, r = rng(5);
  ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.283); ctx.clip();
  g = ctx.createRadialGradient(CX, CY - 60, 40, CX, CY, R);
  g.addColorStop(0, '#9a6a12'); g.addColorStop(0.7, '#6b430a'); g.addColorStop(1, '#3a2204');
  ctx.fillStyle = g; ctx.fillRect(CX - R, CY - R, 2 * R, 2 * R);
  for (let y = CY - R; y < CY + R; y += 34) for (let x = CX - R; x < CX + R; x += 34) {
    const v = r(); ctx.fillStyle = v < 0.5 ? `rgba(255,214,120,${0.04 + 0.16 * r()})` : `rgba(40,20,0,${0.06 + 0.2 * r()})`; ctx.fillRect(x, y, 33, 33);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,210,110,0.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.283); ctx.stroke();

  // star network
  ctx.lineCap = 'round';
  EDGES.forEach(([u, v]) => { const a = P(NODES[u]), b = P(NODES[v]); const you = u === 0; ctx.strokeStyle = you ? 'rgba(255,245,200,0.95)' : 'rgba(255,255,255,0.5)'; ctx.lineWidth = you ? 4.5 : 2.5; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); });
  NODES.forEach((n, i) => {
    const [x, y] = P(n), hub = DEG[i] >= 4, rad = i === 0 ? 17 : 6 + 2.6 * DEG[i];
    if (i === 0) return;
    const gl = ctx.createRadialGradient(x, y, 0, x, y, rad * (hub ? 4.5 : 3));
    gl.addColorStop(0, hub ? 'rgba(255,250,220,0.95)' : 'rgba(255,240,200,0.8)'); gl.addColorStop(0.3, hub ? 'rgba(255,225,130,0.5)' : 'rgba(255,225,130,0.25)'); gl.addColorStop(1, 'rgba(255,200,60,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, rad * (hub ? 4.5 : 3), 0, 6.283); ctx.fill();
    ctx.fillStyle = hub ? '#fffbe6' : '#fff1c9'; ctx.beginPath(); ctx.arc(x, y, rad, 0, 6.283); ctx.fill();
  });
  // numbers on the stars next to "you"
  [1, 2, 3].forEach(i => { const [x, y] = P(NODES[i]); outlined(String(DEG[i]), x, y - 6 - 2.6 * DEG[i] - 18, 54, '#fff', '#000', 10); });
  // "you": a dark, dim star
  { const [x, y] = P(NODES[0]); ctx.fillStyle = '#0a0a0a'; ctx.beginPath(); ctx.arc(x, y, 19, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.stroke();
    outlined('你', x - 74, y + 24, 62, '#fff', '#000', 10); outlined('3', x, y - 36, 50, '#fff', '#000', 10); }

  // title
  outlined('朋友都比你', 540, 228, 190, '#ffffff', '#000', 18, { glow: 'rgba(255,255,255,0.35)' });
  outlined('受欢迎？', 540, 470, 240, '#fff200', '#000', 20, { glow: 'rgba(255,230,0,0.45)' });
  // pill subtitle
  ctx.save(); rr(250, 540, 580, 104, 52); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.font = `900 70px ${SANS}`; ctx.letterSpacing = '10px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('友谊悖论', 545, 616); ctx.restore();
  ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center'; ctx.fillText('@比特双子', 540, 1412); ctx.restore();
}
window.ready = (async () => {
  const sample = '朋友都比你受欢迎？友谊悖论@比特双子你0123456789';
  await Promise.all([document.fonts.load(`900 100px ${SANS}`, sample), document.fonts.load(`700 26px ${SANS}`, sample)]);
  await document.fonts.ready; draw(); return true;
})();
</script></body></html>
