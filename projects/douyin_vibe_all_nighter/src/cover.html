<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>cover</title>
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="../node_modules/@fontsource/noto-sans-sc/700.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1440"></canvas>
<script>
// Douyin cover, 3:4 (1080x1440) by default, 4:3 (1440x1080) with #43: black, white + yellow bold title, pill subtitle,
// gold-leaf clock dial at 2 a.m. with a wine glass in front (the video's clock ≈ glass motif).
const WIDE = location.hash === '#43';
const W = WIDE ? 1440 : 1080, H = WIDE ? 1080 : 1440, cv = document.getElementById('c'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
// layout: dial centre/radius, title lines [x, y, size], pill [x, y, w, h], text alignment, watermark
const L = WIDE
  ? { cx: 1100, cy: 560, r: 330, t1: [80, 330, 150], t2: [80, 560, 196], align: 'left', pill: [80, 640, 500, 100], wm: [80, 1040] }
  : { cx: 540, cy: 1000, r: 400, t1: [540, 228, 190], t2: [540, 470, 230], align: 'center', pill: [250, 540, 580, 104], wm: [540, 1412] };
const SANS = '"Noto Sans SC"';
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function outlined(str, x, y, size, fill, stroke, lw, { align = 'center', glow = null } = {}) {
  ctx.save(); ctx.font = `900 ${size}px ${SANS}`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 36; }
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y);
  ctx.shadowBlur = 0; ctx.fillStyle = fill; ctx.fillText(str, x, y); ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

const CX = L.cx, CY = L.cy, R = L.r;
function hand(ang, len, w, col) {          // ang in "clock hours"
  const a = (ang / 12) * 2 * Math.PI - Math.PI / 2;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(CX - Math.cos(a) * 30, CY - Math.sin(a) * 30); ctx.lineTo(CX + Math.cos(a) * len, CY + Math.sin(a) * len); ctx.stroke(); ctx.restore();
}
function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // warm bloom behind the dial
  let g = ctx.createRadialGradient(CX, CY, 280, CX, CY, 700);
  g.addColorStop(0, 'rgba(255,175,40,0.6)'); g.addColorStop(0.55, 'rgba(255,150,30,0.2)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // gold-leaf dial
  const r = rng(11);
  ctx.save(); ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.283); ctx.clip();
  g = ctx.createRadialGradient(CX, CY - 60, 40, CX, CY, R);
  g.addColorStop(0, '#9a6a12'); g.addColorStop(0.7, '#6b430a'); g.addColorStop(1, '#3a2204');
  ctx.fillStyle = g; ctx.fillRect(CX - R, CY - R, 2 * R, 2 * R);
  for (let y = CY - R; y < CY + R; y += 34) for (let x = CX - R; x < CX + R; x += 34) {
    const v = r(); ctx.fillStyle = v < 0.5 ? `rgba(255,214,120,${0.04 + 0.16 * r()})` : `rgba(40,20,0,${0.06 + 0.2 * r()})`; ctx.fillRect(x, y, 33, 33);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,210,110,0.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(CX, CY, R, 0, 6.283); ctx.stroke();
  // hour ticks
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * 6.283 - Math.PI / 2, big = i % 5 === 0, r0 = R - (big ? 52 : 26);
    ctx.strokeStyle = big ? 'rgba(255,245,210,0.95)' : 'rgba(255,230,170,0.45)'; ctx.lineWidth = big ? 8 : 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0); ctx.lineTo(CX + Math.cos(a) * (R - 16), CY + Math.sin(a) * (R - 16)); ctx.stroke();
  }
  // 2 a.m.: hands
  hand(2, R * 0.52, 16, '#fff6dc'); hand(0, R * 0.78, 9, '#fff6dc');
  ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(CX, CY, 16, 0, 6.283); ctx.fill();
  // wine glass in front, slightly right-of-centre
  const k = R / 400, gx = CX - 165 * k, gy = CY + 70 * k;
  ctx.save(); ctx.translate(gx, gy); ctx.scale(0.82 * k, 0.82 * k);
  // wine
  ctx.beginPath(); ctx.moveTo(-118, -70); ctx.quadraticCurveTo(-112, 60, 0, 70); ctx.quadraticCurveTo(112, 60, 118, -70); ctx.closePath();
  g = ctx.createLinearGradient(0, -70, 0, 70); g.addColorStop(0, '#ff5a4a'); g.addColorStop(1, '#a3121e');
  ctx.fillStyle = g; ctx.shadowColor = 'rgba(255,60,50,0.8)'; ctx.shadowBlur = 40; ctx.fill(); ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,200,190,0.55)'; ctx.beginPath(); ctx.ellipse(0, -70, 118, 16, 0, 0, 6.283); ctx.fill();
  // glass outline
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 9; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-135, -190); ctx.quadraticCurveTo(-140, 70, 0, 92); ctx.quadraticCurveTo(140, 70, 135, -190); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 92); ctx.lineTo(0, 250); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, 258, 96, 16, 0, 0, 6.283); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(-100, -150); ctx.quadraticCurveTo(-104, -40, -70, 20); ctx.stroke();
  ctx.restore();
  // title
  outlined('熬一个通宵', L.t1[0], L.t1[1], L.t1[2], '#ffffff', '#000', 18, { align: L.align, glow: 'rgba(255,255,255,0.35)' });
  outlined('≈ 醉驾？', L.t2[0], L.t2[1], L.t2[2], '#fff200', '#000', 20, { align: L.align, glow: 'rgba(255,230,0,0.45)' });
  // pill subtitle
  const [px, py, pw, ph] = L.pill;
  ctx.save(); rr(px, py, pw, ph, ph / 2); ctx.fillStyle = '#000'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.stroke(); ctx.restore();
  ctx.save(); ctx.font = `900 70px ${SANS}`; ctx.letterSpacing = '10px'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText('疲劳驾驶', px + pw / 2 + 5, py + ph * 0.73); ctx.restore();
  ctx.save(); ctx.font = `700 26px ${SANS}`; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'center'; ctx.textAlign = L.align; ctx.fillText('@比特双子', L.wm[0], L.wm[1]); ctx.restore();
}
window.ready = (async () => {
  const sample = '熬一个通宵≈醉驾？疲劳驾驶@比特双子';
  await Promise.all([document.fonts.load(`900 100px ${SANS}`, sample), document.fonts.load(`700 26px ${SANS}`, sample)]);
  await document.fonts.ready; draw(); return true;
})();
</script></body></html>
